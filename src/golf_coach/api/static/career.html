<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Golf Coach Career</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; margin: 0; padding: 1.25rem; max-width: 480px; }
  h1 { font-size: 1.1rem; margin: 0 0 0.25rem; }
  h2 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em;
       opacity: 0.6; margin: 1.5rem 0 0.5rem; }
  a.back { font-size: 0.85rem; }
  .banner { padding: 0.7rem 0.85rem; border-radius: 8px; margin-top: 1rem; font-size: 0.9rem; }
  .banner.warn { background: rgba(220,160,40,0.18); border: 1px solid rgba(220,160,40,0.5); }
  .banner.error { background: rgba(200,60,60,0.18); border: 1px solid rgba(200,60,60,0.5); }
  .banner.info { background: rgba(128,128,128,0.15); }
  .muted { opacity: 0.65; font-size: 0.83rem; }
  /* One card per metric. A metric is the unit someone reads here — its center, its spread, its
     findings and its tour placement are four answers about one number, and splitting them into
     four tables would make the reader do the join the whole milestone exists to do for them. */
  .metric { border: 1px solid rgba(128,128,128,0.28); border-radius: 8px;
            padding: 0.6rem 0.75rem; margin-bottom: 0.75rem; }
  .metric h3 { font-size: 0.92rem; margin: 0 0 0.1rem; font-family: ui-monospace, monospace; }
  .row { display: flex; gap: 0.5rem; font-size: 0.85rem; padding: 0.22rem 0;
         border-top: 1px solid rgba(128,128,128,0.18); }
  .row:first-of-type { border-top: none; }
  .row .k { flex: 0 0 4.6rem; opacity: 0.6; }
  .row .v { flex: 1; font-variant-numeric: tabular-nums; }
  /* A refused claim must not look like a quiet value. It reads as struck-through-adjacent: same
     row, visibly lighter, and always carrying the sentence that says what it waits for. */
  .row.refused .v { opacity: 0.55; font-style: italic; font-variant-numeric: normal; }
  .reading { font-size: 0.84rem; opacity: 0.85; margin: 0.45rem 0 0; }
  .pill { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em;
          border-radius: 999px; padding: 0.08rem 0.45rem; border: 1px solid currentColor; }
  .pill.yes { color: #2a7; }
  .pill.cannot { color: #c93; }
  .pill.held { color: #888; }
  /* "Waiting" and "blocked" need opposite responses — one says book another bay hour, the other
     says this metric needs a reference band first — so they must never render identically. */
  .why { font-size: 0.79rem; margin: 0.3rem 0 0; padding-left: 0.6rem;
         border-left: 2px solid rgba(128,128,128,0.4); opacity: 0.8; }
  .why.blocked { border-left-color: rgba(200,60,60,0.5); }
  details { margin-top: 1.25rem; font-size: 0.85rem; }
  details summary { cursor: pointer; font-size: 0.8rem; text-transform: uppercase;
                    letter-spacing: 0.06em; opacity: 0.6; }
  details ul { padding-left: 1.1rem; }
  details li { margin-bottom: 0.3rem; }

  /* --- the bag [M9 P19] ------------------------------------------------------------ */
  /* One <details> per club, collapsed. Fourteen clubs times six metrics rendered flat is a
     page nobody scrolls, and the summary line carries the number most visits came for. */
  .club { border: 1px solid rgba(128,128,128,0.28); border-radius: 8px;
          margin: 0 0 0.5rem; font-size: 1rem; }
  .club > summary { cursor: pointer; padding: 0.5rem 0.7rem; font-size: 0.87rem;
                    text-transform: none; letter-spacing: normal; opacity: 1; }
  .club > summary .id { font-family: ui-monospace, monospace; text-transform: uppercase;
                        font-weight: 600; }
  .club .body { padding: 0 0.7rem 0.7rem; }
  .club .metric { margin: 0.6rem 0 0; }
  .entry { font-size: 0.85rem; margin: 0.3rem 0 0.5rem; }
  /* An undeclared entry is spelled out rather than left blank, for the reason
     scripts/club_profile.py gives at the same place: a blank cell reads as a zero loft. */
  .entry.none { opacity: 0.72; }
  /* The read half of the spec [M12 P8]. Same .row grid the metric cards use, because it is the
     same shape of answer — a name and a value — and a golfer scrolling from a carry average into
     a loft should not have to re-learn how a line is read. Only .k widens: "adjustable hosel"
     does not fit the 4.6rem a metric key needs, and a wrapped label misaligns its value. */
  .spec { margin: 0.1rem 0 0.2rem; }
  .spec .row .k { flex: 0 0 8rem; }
  /* Blanks are listed, not omitted, and they are visibly quieter than a recorded value — the
     distinction the whole entry exists to keep is between a number nobody knows and one nobody
     has shown you. */
  .spec .blank { font-size: 0.78rem; opacity: 0.5; padding: 0.2rem 0 0.1rem; }
  /* 7.5rem and not M9's 4.2rem: the form carries every ClubSpec field now and "adjustable
     hosel" is the longest label in it. A label that wraps misaligns the input beside it. */
  .edit { display: grid; grid-template-columns: 7.5rem 1fr; gap: 0.3rem 0.5rem;
          align-items: center; font-size: 0.82rem; margin: 0.15rem 0 0.5rem; }
  .edit input, .edit select { width: 100%; font: inherit; padding: 0.22rem 0.35rem; }
  .edit .pair { display: flex; gap: 0.3rem; }
  /* The groups of contracts/club_spec.py, rendered because the grouping is real: reading down
     twenty-seven fields, a golfer needs to know where the head stops and the shaft starts. */
  .grp { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.06em; opacity: 0.5;
         margin: 0.5rem 0 0; }
  .actions { display: flex; gap: 0.4rem; margin-top: 0.45rem; }
  button, select { font: inherit; font-size: 0.8rem; padding: 0.2rem 0.5rem; cursor: pointer; }
  .note { font-size: 0.83rem; margin: 0.45rem 0 0; padding-left: 0.6rem;
          border-left: 2px solid rgba(128,128,128,0.4); opacity: 0.85; }

  /* --- the club lookup [M12 P6] ----------------------------------------------------- */
  /* One candidate per slot, each a filled-in form rather than a preview: what the golfer is
     looking at is the thing that gets saved, which is what makes the confirm step ADR-026 §5
     asks for a real one rather than an OK button. */
  .search { display: flex; flex-wrap: wrap; gap: 0.35rem; align-items: center;
            font-size: 0.82rem; margin: 0.6rem 0 0; }
  .search input { font: inherit; font-size: 0.8rem; padding: 0.2rem 0.35rem; }
  .search input.make { width: 6.5rem; }
  .search input.model { width: 7rem; }
  .search input.year { width: 4.5rem; }
  .cand { border: 1px solid rgba(128,128,128,0.28); border-radius: 8px;
          padding: 0.35rem 0.7rem 0.6rem; margin: 0.6rem 0 0; }
  .cand .chead { margin: 0.15rem 0 0; font-size: 0.85rem; }
  .cand .chead .id { font-family: ui-monospace, monospace; text-transform: uppercase;
                     font-weight: 600; }

  /* --- tempo [ADR-023 addendum] ---------------------------------------------------- */
  /* The same warm card results.html gives the trainer, and deliberately the same: a golfer who
     has practiced to the metronome on a swing page should recognise this one on sight as the same
     instrument. Everything below `.tempo` here is a copy of that page's rules for the shared
     markup in `tempo.js` — the CSS is duplicated because there is no stylesheet link and no build
     step (REFACTOR_LEDGER, 2026-08-13), while the markup and behaviour it styles are not. */
  .tempo { background: rgba(200,150,60,0.12); border: 1px solid rgba(200,150,60,0.4);
           border-radius: 8px; padding: 0.7rem 0.85rem; font-size: 0.88rem; }
  .tempo p { margin: 0 0 0.6rem; }
  .tempo .modes { display: flex; gap: 0.4rem; margin-bottom: 0.6rem; }
  .tempo .modes button { font: inherit; font-size: 0.8rem; padding: 0.3rem 0.6rem;
                         border-radius: 6px; border: 1px solid rgba(128,128,128,0.45);
                         background: transparent; color: inherit; cursor: pointer; flex: 1; }
  .tempo .modes button[aria-pressed="true"] { border-color: rgba(200,150,60,0.9);
                                              background: rgba(200,150,60,0.2); }
  .tempo .strip { display: flex; align-items: flex-end; height: 2.2rem; margin: 0.5rem 0 0.2rem;
                  color: rgba(200,150,60,1); }
  .tempo .strip .b { width: 3px; border-radius: 2px; background: currentColor; flex: none; }
  .tempo .strip .b.takeaway, .tempo .strip .b.top, .tempo .strip .b.impact { height: 100%; }
  .tempo .strip .b.subdivision { height: 45%; opacity: 0.35; }
  .tempo .strip .gap { flex-grow: 1; }
  .tempo .legend { display: flex; justify-content: space-between; font-size: 0.72rem;
                   opacity: 0.6; }
  .tempo .controls { display: flex; gap: 0.5rem; align-items: center; }
  .tempo .controls button.play { font: inherit; font-size: 0.9rem; padding: 0.45rem 0.9rem;
                                 border-radius: 6px; border: 1px solid rgba(128,128,128,0.45);
                                 background: transparent; color: inherit; cursor: pointer; }
  .tempo .controls label { font-size: 0.78rem; opacity: 0.7; display: flex; gap: 0.35rem;
                           align-items: center; flex: 1; min-width: 0; }
  .tempo .controls input[type=range] { flex: 1; min-width: 0; }
  .tempo .facts { font-size: 0.78rem; opacity: 0.7; margin: 0.55rem 0 0;
                  font-variant-numeric: tabular-nums; }
  .tempo .anchor { font-size: 0.76rem; opacity: 0.75; margin: 0.3rem 0 0; }
  /* The out-of-range notice, and the snap inside it. Deliberately not styled as an error: the
     downswing it is about is what the target is fitted to, not a fault, so it reads at the same
     weight as the anchor sentence it follows and is set apart by a rule rather than by colour. */
  .tempo .notice { font-size: 0.76rem; margin: 0.45rem 0 0; padding: 0.4rem 0 0.4rem 0.55rem;
                   border-left: 2px solid rgba(200,150,60,0.75); }
  .tempo .notice button { font: inherit; font-size: 0.74rem; padding: 0.25rem 0.55rem;
                          margin-left: 0.3rem; border-radius: 6px;
                          border: 1px solid rgba(128,128,128,0.45); background: transparent;
                          color: inherit; cursor: pointer; white-space: nowrap; }
  .tempo .src { font-size: 0.72rem; opacity: 0.55; margin: 0.3rem 0 0; }

  /* The headline numbers, above the card. Big because this is the thing the golfer came for —
     every simulator user has a different tempo and the whole point of the page is knowing yours —
     and split into three rows because "latest" and "typical" are different kinds of claim and must
     never merge into one number. `.held` is the withheld state, styled like `.row.refused`. */
  .tnums { display: flex; gap: 0.9rem; flex-wrap: wrap; margin: 0 0 0.7rem; }
  .tnums .n { flex: 1 1 6.5rem; }
  .tnums .k { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; opacity: 0.55; }
  .tnums .v { font-size: 1.6rem; font-weight: 700; line-height: 1.1;
              font-variant-numeric: tabular-nums; }
  .tnums .v.held { font-size: 0.95rem; font-weight: 400; font-style: italic; opacity: 0.6;
                   font-variant-numeric: normal; }
  .tnums .sub { font-size: 0.75rem; opacity: 0.65; font-variant-numeric: tabular-nums; }
  /* Oldest first, matching `CareerTempo.swings` — a history that reads down the page in the order
     it happened is the one a golfer can check against their own memory of the session. */
  .thist { font-size: 0.83rem; }
  .thist .s { display: flex; justify-content: space-between; gap: 0.6rem;
              border-top: 1px solid rgba(128,128,128,0.2); padding: 0.28rem 0; }
  .thist .s:first-child { border-top: none; }
  .thist .r { font-variant-numeric: tabular-nums; font-weight: 600; }
  .thist .d { opacity: 0.6; font-size: 0.78rem; }
</style>
</head>
<body>
<a class="back" href="/">&larr; Upload</a>
<a class="back" href="/library.html">Library</a>
<!-- An in-page anchor and not a fourth page. The bag is a section of this golfer's career and
     reads as one — the whole-bag cards below it only mean anything once you have seen which
     clubs they were pooled from — so what was missing was never a page, it was a way to land on
     the section without scrolling past the tempo card looking for it. `#bag` is the <h2> itself
     (see render()), so the heading arrives at the top of the viewport rather than just above it. -->
<a class="back" href="#bag">Bag</a>
<div id="root"><p class="muted">Loading...</p></div>

<script src="/tempo.js"></script>
<script>
const TOKEN_KEY = "golf_coach_token";
const params = new URLSearchParams(location.search);
const playerId = params.get("player");
const root = document.getElementById("root");

// The bag section's own state. Kept beside the page rather than re-fetched per interaction: the
// two writers return the whole bag, so `bagPayload` after a save is exactly what a reload would
// give — including the caveat that declaring an entry is what creates.
let bagPayload = null;      // the /bag payload, replaced wholesale by every write
let clubList = [];          // the full taxonomy, canonical bag order, straight from /api/clubs
let editingClub = null;     // which row has its form open; at most one at a time
let bagError = null;        // the last write failure, shown until the next render

// The lookup's own state [M12 P6], separate from everything above because it outlives a render: a
// set lookup takes half a minute (M12 P5 *As built*), so what was asked for has to survive the
// wait, and what came back has to survive a save that only half worked.
//
// `candidates` is three-valued on purpose. `null` is "nothing has been looked up", `[]` is "a
// lookup ran and the source had nothing", and those need opposite sentences — a page showing the
// same blank for both would make a refusal look like an idle form.
let lookupState = {
  make: "", model: "", year: "", from: "", to: "",  // the search box, kept across renders
  slots: [],                                        // what was asked for, in taxonomy order
  pending: false,                                   // a call is in flight; do not fire another
  note: "",                                         // the route's own note about the answer
  message: "", messageKind: "note",                 // the panel's one line of feedback
  candidates: null,
};

function authHeaders() {
  const t = localStorage.getItem(TOKEN_KEY);
  return t ? { "X-Upload-Token": t } : {};
}

function esc(value) {
  return String(value).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
}

// Unit -> decimal places, the table scripts/club_profile.py carries and for the reason M9 P17
// found. The rule here used to be `1dp for degrees, 3dp otherwise`, written when every metric in
// this repo was shoulder-width-normalized; P8-P10 put yards and mph into `measurements`, and that
// rule prints "154.400 yards" — precision the launch monitor does not have and nobody reads. The
// same table is in both career CLIs and in results.html, so a number read off the page and a
// number read off the shell are still the same string.
const PRECISION = { degrees: 1, yards: 1, mph: 1, ms: 1, ratio: 3, shoulder_widths: 3 };
// An unlisted unit takes three rather than one, deliberately: too much precision is noise a reader
// can see and complain about, too little is a digit that quietly went missing.
const DEFAULT_PRECISION = 3;

function fmt(value, unit) {
  if (typeof value !== "number") return "-";
  return value.toFixed(unit in PRECISION ? PRECISION[unit] : DEFAULT_PRECISION);
}

function plural(n, word) { return `${n} ${word}${n === 1 ? "" : "s"}`; }

// 1st / 2nd / 3rd / 4th, and the teens that break the pattern. Trivial, and worth having: the
// first render of this page said "61th".
function ordinal(n) {
  const v = Math.round(n);
  if (v % 100 >= 11 && v % 100 <= 13) return `${v}th`;
  return `${v}${["th", "st", "nd", "rd"][v % 10] || "th"}`;
}

async function load() {
  if (!playerId) { await pickGolfer(); return; }
  let payload;
  try {
    // Three routes in one trip. None of them depends on another's answer, and a phone on
    // cellular pays for round trips — the same argument /api/clubs was built on in M9 P7.
    const [res, bagRes, clubsRes] = await Promise.all([
      fetch(`/api/golfers/${encodeURIComponent(playerId)}/career`, { headers: authHeaders() }),
      fetch(`/api/golfers/${encodeURIComponent(playerId)}/bag`, { headers: authHeaders() }),
      fetch("/api/clubs", { headers: authHeaders() }),
    ]);
    if (res.status === 401) {
      root.innerHTML = `<div class="banner error">This phone isn't set up. Reopen the setup
        link (the one ending in /?t=...) to register it.</div>`;
      return;
    }
    if (res.status === 404) {
      root.innerHTML = `<div class="banner error">No golfer ${esc(playerId)} on file.</div>`;
      await pickGolfer(true);
      return;
    }
    payload = await res.json();
    bagPayload = bagRes.ok ? await bagRes.json() : null;
    // Only the taxonomy half. /api/clubs also reports a bag, but it is the *session cursor's*
    // golfer's — this page is about ?player=, who is not necessarily the one standing in the bay.
    // The order is ClubId's declaration order at the route, so nothing here sorts it.
    clubList = clubsRes.ok ? ((await clubsRes.json()).clubs || []) : [];
  } catch (err) {
    root.innerHTML = `<div class="banner error">Could not load: ${esc(err.message)}</div>`;
    return;
  }
  render(payload);
}

// No ?player= — the page is reachable from a bookmark as well as from a swing, so it offers the
// registry rather than erroring at someone who typed the bare URL.
async function pickGolfer(append = false) {
  let golfers = [];
  try {
    const res = await fetch("/api/golfers", { headers: authHeaders() });
    golfers = (await res.json()).golfers || [];
  } catch (err) { /* fall through to the empty case */ }
  const links = golfers.map((g) =>
    `<li><a href="/career.html?player=${encodeURIComponent(g.player_id)}">${esc(g.display_name)}</a></li>`
  ).join("");
  const html = links
    ? `<h2>Whose career?</h2><ul>${links}</ul>`
    : `<div class="banner info">No golfers on file yet. Set one on the upload page.</div>`;
  root.innerHTML = append ? root.innerHTML + html : html;
}

function render(payload) {
  const baseline = payload.baseline || {};
  const dispersion = payload.dispersion || {};
  const standing = payload.standing || {};
  const corpus = payload.corpus || {};
  const metrics = baseline.metrics || {};

  const parts = [
    `<h1>${esc(payload.display_name)} <span class="muted">&middot; ${esc(payload.player_id)},
      ${esc(payload.handedness)}-handed</span></h1>`,
    corpusLine(corpus, baseline),
  ];

  // The bag goes above the whole-bag cards, and that order is the argument M9 exists to make: a
  // carry pooled across a driver and a wedge describes nobody's shot, so a page leading with
  // whole-bag numbers re-teaches the reading this milestone was built to correct. The cards below
  // stay whole-bag legitimately — ranges.json holds club_category "all" rows only, so the club is
  // not an axis the mechanics vary on (ADR-024, and ADR-010 gated per-club bands and cut none).
  //
  // Filled by renderBag() after the innerHTML lands, because every edit re-renders this subtree
  // alone and re-rendering the whole page would collapse the details the golfer just opened.
  // Tempo goes first, above the bag and above every card. It is the one number on this page a
  // golfer can act on standing in the bay, and unlike almost everything else here it has something
  // to say at n=2 — the readings are measurements, so they are printed while the mean they would
  // average to is still withheld. Landing it at the top is also what makes `#tempo` from the
  // upload page arrive somewhere useful rather than scrolling past fourteen clubs.
  parts.push(tempoSection(payload.tempo));

  // `id="bag"` is on the heading and not on the container it names, so the fragment link in the
  // nav — and the one the upload page's golfer chip carries — lands with the heading in view.
  // The container underneath is what renderBag() replaces, and the two ids are separate for that
  // reason: an anchor inside a subtree that gets rewritten is an anchor that stops existing.
  parts.push(`<h2 id="bag">Bag</h2><div id="bag-body"></div>`);
  parts.push(`<h2>Whole bag</h2>`);

  const names = Object.keys(metrics).sort();
  if (!names.length) {
    parts.push(`<div class="banner info">No measurement on any swing yet — nothing to build a
      baseline from. The commonest causes are swings that were never analyzed and swings
      analyzed by an older engine; the breakdown below says which.</div>`);
  } else {
    // Said once, at the top, rather than repeated on eight cards. The cards then explain
    // themselves individually, because the refusals differ per metric and per claim.
    if (nothingSayable(metrics)) {
      parts.push(`<div class="banner info"><strong>Nothing is sayable yet.</strong> Every claim
        below is refused, and each one names what it is waiting for. A baseline printed over two
        swings would look like progress and be exactly the thing this was built not to do.</div>`);
    }

    for (const name of names) {
      parts.push(metricCard(metrics[name], (dispersion.metrics || {})[name],
                            (standing.metrics || {})[name]));
    }

    if (nothingSayable(metrics)) {
      parts.push(`<p class="muted">The unblock is a bay session: 20&ndash;30 swings with shots
        attached.</p>`);
    }
  }
  parts.push(exclusions(corpus));
  root.innerHTML = parts.join("");

  // Delegated, and bound to the container rather than to the buttons: renderBag() replaces this
  // element's whole subtree on every edit, so per-button listeners would be re-bound each time
  // and the ones on the old nodes would leak. Same shape as index.html's `golfer-fix` handler.
  const host = document.getElementById("bag-body");
  host.addEventListener("click", onBagClick);
  renderBag();
  wireTempo(payload.tempo);

  // The browser resolved `#tempo` before this page had any content — everything above is rendered
  // from a fetch — so the fragment silently did nothing and the upload page's tempo link landed at
  // the top like the career one beside it. Scrolled here, once the target exists.
  if (location.hash) {
    document.getElementById(location.hash.slice(1))?.scrollIntoView();
  }
}

// --------------------------------------------------------------------------- tempo [ADR-023]
//
// The career counterpart to results.html's per-swing trainer, and the reason `CareerTempo` exists:
// the swing page answers "was *that* one quick", this answers "what do I usually do". The
// mechanism — beats, audio, strip, pace — is `tempo.js`, shared between the two.
//
// **Three tiers, rendered differently on purpose, because they are different kinds of statement:**
// the readings are measurements and print at any `n`; the typical values are claims and are
// `null` until career mode's `CENTER` guard lifts; the plan is a target. A page that flattened
// them would print a tendency over two swings, which is the exact thing career mode was built not
// to do — and would also, in the other direction, refuse a golfer numbers that are sitting
// measured in their own artifacts.
//
// No ratio, duration or refusal sentence is composed here. Every one arrives on `payload.tempo`
// from `analysis/tempo_trainer.py`, the same standing rule the metric cards below follow.
function tempoSection(tempo) {
  if (!tempo) return "";
  if (!tempo.swings.length) {
    return `<h2 id="tempo">Tempo</h2><div class="banner info">No swing on file has a readable
      tempo yet. It is the one measurement that goes missing on its own — the takeaway has to be
      detected, not estimated — so a swing can score everything else and still have none.</div>`;
  }

  const latest = tempo.latest;
  const parts = [`<h2 id="tempo">Tempo</h2>`, `<div class="tnums">`];

  parts.push(numBlock("latest", ratioText(latest.ratio), halvesText(latest)));
  // The strictest refusal is first (`_center_refusals` sorts on `need_n`), and it is the one that
  // gates the ratio — so its floor is the one to count toward. Read off the claim rather than
  // written here: `tempo_ratio`'s override is 8 today and is a judgment call that ADR-023 and
  // `contracts/baseline.py` both expect a real bay session to revise.
  const gate = tempo.withheld[0];
  // The halves gate separately from the ratio and at a lower floor, so between the two floors they
  // are sayable while the ratio is not. Printed in the sub line either way rather than only in the
  // ready branch: withholding a number the guard has already released would be its own kind of
  // false, and the tile is titled "withheld" for the ratio it is actually refusing.
  const typicalHalves = halvesText({ backswing_ms: tempo.typical_backswing_ms,
                                     downswing_ms: tempo.typical_downswing_ms });
  parts.push(tempo.typical_ratio === null
    ? numBlock("typical", "withheld",
               typicalHalves || (gate ? `${gate.have_n} of ${gate.need_n} swings` : ""), true)
    : numBlock("typical", ratioText(tempo.typical_ratio), typicalHalves));

  // The tour figure comes off the CUES pattern, which is the one that keeps the exact medians —
  // GRID's ratio is rounded, and printing that as "tour" would quote a number no tour player hit.
  const cues = (tempo.plan ? tempo.plan.patterns : []).find((p) => p.mode === "cues");
  if (cues) {
    parts.push(numBlock("tour", ratioText(cues.ratio),
                        halvesText({ backswing_ms: cues.backswing_ms,
                                     downswing_ms: cues.downswing_ms })));
  }
  parts.push(`</div>`);

  // Never suppressed once a typical value lands: the refusal explains the number's absence, and
  // seeing the floor it cleared is how a golfer knows what the `n` beside it is worth.
  for (const claim of tempo.withheld) {
    parts.push(`<p class="why"><strong>waiting</strong> &middot; ${esc(claim.reason)}</p>`);
  }

  parts.push(`<div class="thist">${tempo.swings.map(historyRow).join("")}</div>`);

  if (tempo.plan) {
    parts.push(`<h2>Practice this tempo</h2><div class="tempo">
      ${TempoTrainer.markup(tempo.plan)}</div>`);
  }
  return parts.join("");
}

function numBlock(key, value, sub, held = false) {
  return `<div class="n"><div class="k">${esc(key)}</div>
    <div class="v${held ? " held" : ""}">${esc(value)}</div>
    <div class="sub">${esc(sub)}</div></div>`;
}

// `2.42:1`, at the ratio precision the whole repo formats to — `fmt` carries that table, so a
// tempo read off this page and one read off `scripts/career_baseline.py` are the same string.
function ratioText(ratio) {
  return typeof ratio === "number" ? `${fmt(ratio, "ratio")}:1` : "-";
}

// The two halves under the ratio, and they earn their place: the ratio alone cannot say *which*
// half is off. ADR-023 records the case exactly — this golfer's backswing is the tour median and
// the downswing is past p90, so "tempo too quick" is true of the ratio and the opposite of what it
// sounds like. Since M13 that downswing is what the target is fitted to rather than grounds for
// refusing one, and the trainer's own notice is where the golfer is told it is out of range; these
// two numbers are what makes that notice checkable against the swings it was built from.
function halvesText(swing) {
  const back = swing && swing.backswing_ms;
  const down = swing && swing.downswing_ms;
  if (typeof back !== "number" || typeof down !== "number") return "";
  return `${fmt(back, "ms")} / ${fmt(down, "ms")} ms`;
}

function historyRow(swing) {
  const halves = halvesText(swing);
  return `<div class="s"><span class="r">${esc(ratioText(swing.ratio))}</span>
    <span class="d">${esc(swing.captured_at.slice(0, 10))} &middot; ${esc(swing.swing_ref)}${
      halves ? ` &middot; ${esc(halves)}` : ""}</span></div>`;
}

// The anchor sentence is this page's own, and has a state results.html does not: a golfer whose
// mean is still withheld is anchored to their most recent swing, which is neither "your own
// typical downswing" nor "the tour median" and must not be described as either.
//
// All three name the *downswing*, which is the half the target is fitted to since M13 — the half
// the golfer feels. `tour_median` lost its "or yours sits outside the tour range" clause with the
// guard that made it true: an out-of-range downswing is still anchored to, and saying so is the
// trainer's notice rather than this sentence's.
const ANCHOR_TEXT = {
  career_mean: "Matched to your own typical downswing — only the ratio is the tour's.",
  latest_swing: "Matched to your most recent swing's downswing: your typical one is still "
    + "withheld, and one measured swing is a better target than the tour median.",
  tour_median: "Set to the tour median downswing — nothing measurable of your own to anchor on.",
};

function wireTempo(tempo) {
  if (!tempo || !tempo.plan) return;
  TempoTrainer.wire(tempo.plan, { anchorText: ANCHOR_TEXT[tempo.anchor] || "" });
}

function nothingSayable(metrics) {
  return Object.values(metrics).every((m) => !(m.ready || []).length);
}

function corpusLine(corpus, baseline) {
  const bits = [
    `${plural(corpus.distinct_swings || 0, "distinct swing")} across
     ${plural(baseline.built_from_sessions || 0, "session")}`,
  ];
  if (corpus.duplicates_collapsed) {
    bits.push(`${plural(corpus.swing_dirs_seen || 0, "directory").replace("directorys", "directories")}
      on disk, ${corpus.duplicates_collapsed} of them re-uploads of a clip already counted`);
  }
  if (corpus.outdated_swings) {
    bits.push(`${corpus.outdated_swings} analyzed by an older engine — run
      <code>scripts/reanalyze.py</code>`);
  }
  if (corpus.unattributed_swings) {
    bits.push(`${corpus.unattributed_swings} naming no golfer`);
  }
  return `<p class="muted">${bits.join(". ")}.</p>`;
}

const FINDING_PILL = {
  established: ["yes", "pill yes"],
  // Never "no": an interval straddling the tolerance is consistent with a real effect and with
  // none, and a column reading "no" beside a real miss would be read as a clean bill.
  not_established: ["cannot tell", "pill cannot"],
  withheld: ["withheld", "pill held"],
};

// A standing is a placement, never a verdict — the contract carries no `score` and no `passed`
// precisely so it cannot read as one. Two things here are load-bearing, and both were found by
// rendering the speaking path rather than by reasoning about it:
//
//   1. Every pill is NEUTRAL. Colouring "outside" amber re-adds through styling the judgement the
//      contract structurally refuses. A tour band describes 122 professionals; an amateur outside
//      it is the normal case, not a fault.
//   2. "Outside" says WHICH SIDE. finish_balance_norm is a one-sided magnitude on a [0, high]
//      band, so a center below p10 is better balanced than the tour population — and the bare word
//      "outside" made that render identically to a center above p90. Same failure as step 5's
//      shared BIASED text: one label that is correct for some metrics and misleading for others.
function standingLabel(tour) {
  if (tour.standing === "outside") {
    return typeof tour.outside_by === "number" && tour.outside_by < 0
      ? "below tour range" : "above tour range";
  }
  return { inside: "inside tour range", straddles: "cannot tell" }[tour.standing] || "withheld";
}

function row(label, value, refused = false) {
  return `<div class="row${refused ? " refused" : ""}"><span class="k">${esc(label)}</span>
    <span class="v">${value}</span></div>`;
}

function pill(map, key) {
  const [text, cls] = map[key] || ["withheld", "pill held"];
  return `<span class="${cls}">${esc(text)}</span>`;
}

function metricCard(base, disp, tour) {
  const unit = base.unit;
  const parts = [`<div class="metric">
    <h3>${esc(base.name)}</h3>
    <p class="muted">${esc(unit.replace(/_/g, " "))} &middot;
      n = ${base.n} over ${plural(base.n_sessions, "session")}</p>`];

  // These are not calls to a "may I show this" predicate. A withheld claim leaves no number
  // behind, so "is there a number" and "may it be shown" are the same question — the property
  // the contract exists to give every consumer, this page included.
  if (typeof base.mean === "number") {
    let v = fmt(base.mean, unit);
    if (base.mean_ci) {
      v += ` <span class="muted">95% CI ${fmt(base.mean_ci.low, unit)} &ndash;
             ${fmt(base.mean_ci.high, unit)}</span>`;
    }
    if (typeof base.median === "number") {
      v += ` <span class="muted">(median ${fmt(base.median, unit)})</span>`;
    }
    parts.push(row("center", v));
  } else {
    parts.push(row("center", "no typical value yet", true));
  }

  if (typeof base.sd === "number") {
    let v = `sd ${fmt(base.sd, unit)}`;
    if (base.sd_ci) {
      v += ` <span class="muted">95% CI ${fmt(base.sd_ci.low, unit)} &ndash;
             ${fmt(base.sd_ci.high, unit)}</span>`;
    }
    if (typeof base.minimum === "number") {
      v += ` <span class="muted">(range ${fmt(base.minimum, unit)} &ndash;
             ${fmt(base.maximum, unit)})</span>`;
    }
    parts.push(row("spread", v));
  } else {
    parts.push(row("spread", "no repeatability claim yet", true));
  }

  if (disp) {
    parts.push(row("bias", pill(FINDING_PILL, disp.bias), disp.bias === "withheld"));
    let scatter = pill(FINDING_PILL, disp.scatter);
    if (typeof disp.within_session_sd === "number") {
      scatter += ` <span class="muted">within-session ${fmt(disp.within_session_sd, unit)}</span>`;
    }
    parts.push(row("scatter", scatter, disp.scatter === "withheld"));
    if (disp.pattern) {
      parts.push(row("pattern", esc(disp.pattern.replace(/_/g, " "))));
    }
  }

  if (tour) {
    let v = `<span class="pill held">${esc(standingLabel(tour))}</span>`;
    if (typeof tour.band_low === "number") {
      v += ` <span class="muted">tour ${fmt(tour.band_low, unit)} &ndash;
             ${fmt(tour.band_high, unit)}`;
      if (tour.population_players) v += ` (${tour.population_players} players)`;
      v += `</span>`;
    }
    if (typeof tour.percentile === "number") {
      // The clamp said out loud. `percentile_of` stops at the stored quantiles, so a rail value
      // is a floor on how extreme the center is and not its rank.
      v += ` <span class="muted">&middot; ${tour.percentile_clamped ? "at least " : ""}`;
      v += `${ordinal(tour.percentile)} pct</span>`;
    }
    if (typeof tour.outside_by === "number") {
      v += ` <span class="muted">&middot; ${tour.outside_by > 0 ? "+" : ""}`;
      v += `${fmt(tour.outside_by, unit)} past the edge</span>`;
    }
    parts.push(row("vs tour", v, tour.standing === "withheld"));
  }

  const reading = (disp && disp.points_at) || (tour && tour.reading);
  if (reading) parts.push(`<p class="reading">${esc(reading)}</p>`);
  for (const caveat of (disp && disp.caveats) || []) {
    parts.push(`<p class="why">${esc(caveat)}</p>`);
  }

  // Deduplicated across the three layers: a CENTER refusal legitimately arrives from the
  // baseline, the dispersion and the standing, and printing it three times would read as three
  // different problems.
  const waiting = new Map();
  for (const r of base.withheld || []) waiting.set(r.reason, r);
  for (const r of (disp && disp.withheld) || []) waiting.set(r.reason, r);
  for (const r of (tour && tour.withheld) || []) waiting.set(r.reason, r);
  for (const r of waiting.values()) {
    parts.push(`<p class="why"><strong>waiting</strong> &middot; ${esc(r.reason)}</p>`);
  }

  const blocked = new Set([...((disp && disp.unavailable) || []),
                           ...((tour && tour.unavailable) || [])]);
  for (const reason of blocked) {
    parts.push(`<p class="why blocked"><strong>blocked</strong> &middot; ${esc(reason)}</p>`);
  }

  parts.push(`</div>`);
  return parts.join("");
}

// Never absorbed into a count. A swing that contributes nothing is a swing the baseline does not
// know about, and an `n` that shrank for a reason nobody recorded is indistinguishable from a
// reader with a bug.
function exclusions(corpus) {
  const list = corpus.excluded || [];
  if (!list.length) return "";
  return `<details><summary>Swings contributing no sample (${list.length})</summary>
    <ul>${list.map((e) =>
      `<li><code>${esc(e.ref)}</code> &mdash; <strong>${esc(e.reason)}</strong>:
       ${esc(e.detail)}</li>`).join("")}</ul></details>`;
}

// --------------------------------------------------------------------------------- the bag
//
// Everything below renders one BagProfile (M9 P14) and writes through two routes. Nothing here
// averages, gates or judges: `analysis/club_profile.py` narrows the corpus per club and hands each
// slice to career mode's own guard, so a refusal that arrives here is already sealed and this
// page's only job is to show it as a sentence rather than as a blank cell.

// Which fields of a spec the form edits, grouped exactly as `contracts/club_spec.py` groups
// them — and this page's only field list [M12 P6]. `recorded_at` and `retired_at` are absent
// because the store owns the clock; `provenance` is absent because it is echoed back from a
// lookup and never typed; `club` is absent because it is the route's path segment — putting it in
// the body as well would be a second spelling free to disagree with the first.
//
// It replaced M9's five-field ENTRY_FIELDS, and being *one* list is the point: the same renderer
// draws the edit form and every row of a lookup, so a field added to `ClubSpec` is added here and
// nowhere else. `tests/api/test_career_page.py` compares this list against the contract on every
// run — a field that exists on `ClubSpec`, is accepted by `BagEntryRequest` and is missing here is
// a form that silently cannot record it, which is a 200 for a value that went nowhere
// (`mcp/query.py`'s `_METRIC_FIELDS` failure, one surface further out).
//
// **`shaft_material` and `shaft_flex` are text inputs and not <select>s on purpose.** Listing
// their members here would put a second copy of a closed vocabulary in the page — the failure
// `GET /api/clubs` exists to prevent for the club taxonomy (`tests/api/test_uploads.py:537`) —
// and it buys nothing: the save route parses both through `parse_shaft_flex` and refuses an
// unrecognised spelling with a sentence naming what it rejected, so the guard is one round trip
// away rather than absent. The tri-state selects below are not a vocabulary; they are a
// `bool | None`, where "not recorded" and "no" are different answers a checkbox cannot both say.
const SPEC_FIELDS = [
  ["identity", [
    ["make", "make", "text"],
    ["model", "model", "text"],
    ["model_year", "model year", "int"],
    ["head_type", "head type", "text"],
    ["set_composition", "set", "text"],
  ]],
  ["head", [
    ["loft_deg", "loft °", "number"],
    ["lie_deg", "lie °", "number"],
    ["bounce_deg", "bounce °", "number"],
    ["grind", "grind", "text"],
    ["offset_mm", "offset mm", "number"],
    ["face_angle_deg", "face angle °", "number"],
    ["head_weight_g", "head weight g", "number"],
    ["adjustable_hosel", "adjustable hosel", "bool"],
    ["loft_range_deg", "loft range °", "range"],
  ]],
  ["shaft", [
    ["shaft_model", "shaft model", "text"],
    ["shaft_material", "material", "text"],
    ["shaft_flex", "flex", "text"],
    ["shaft_weight_g", "shaft weight g", "number"],
    ["shaft_torque_deg", "torque °", "number"],
    ["shaft_kick_point", "kick point", "text"],
  ]],
  ["assembly", [
    ["length_in", "length in", "number"],
    ["swing_weight", "swing weight", "text"],
    ["total_weight_g", "total weight g", "number"],
    ["grip", "grip", "text"],
  ]],
  ["head performance", [
    ["cor", "COR", "number"],
    ["moi_g_cm2", "MOI g cm²", "number"],
    ["usga_conforming", "USGA conforming", "bool"],
  ]],
];

const SPEC_FIELD_COUNT = SPEC_FIELDS.reduce((n, [, fields]) => n + fields.length, 0);

// The form both write paths share. `prefix` keeps the input ids unique, because a set lookup puts
// seven of these on the page at once and a repeated id points every <label> at the first row.
function specForm(prefix, spec) {
  return SPEC_FIELDS.map(([group, fields]) =>
    `<p class="grp">${esc(group)}</p>
     <div class="edit">${fields.map((f) => fieldRow(prefix, f, spec)).join("")}</div>`).join("");
}

// One labelled control. **A field nobody knows renders empty and never zero** — that difference is
// the whole of ADR-026 §6 at the surface a person actually looks at: an empty box is a question,
// where a zero lie angle is an answer, and a wrong answer is what this milestone spends a confirm
// step to avoid.
function fieldRow(prefix, [key, label, type], spec) {
  const id = `${prefix}-${key}`;
  const raw = spec[key];
  if (type === "bool") {
    // Three options and not a checkbox: `None` is not `False` (`ClubSpec.adjustable_hosel`), and
    // a checkbox has no way to say "nobody recorded whether this hosel adjusts".
    const chosen = raw === true ? "yes" : raw === false ? "no" : "";
    const option = (value, text) =>
      `<option value="${value}"${chosen === value ? " selected" : ""}>${text}</option>`;
    return `<label for="${id}">${esc(label)}</label>
      <select id="${id}" data-f="${key}">
        ${option("", "not recorded")}${option("yes", "yes")}${option("no", "no")}</select>`;
  }
  if (type === "range") {
    const pair = Array.isArray(raw) ? raw : ["", ""];
    return `<label for="${id}">${esc(label)}</label>
      <span class="pair">
        <input id="${id}" data-f="${key}" type="number" step="0.1" value="${esc(pair[0])}"
               aria-label="${esc(label)} low">
        <input data-f="${key}" type="number" step="0.1" value="${esc(pair[1])}"
               aria-label="${esc(label)} high"></span>`;
  }
  const value = raw === null || raw === undefined ? "" : raw;
  const step = type === "int" ? ` step="1"` : type === "number" ? ` step="0.1"` : "";
  return `<label for="${id}">${esc(label)}</label>
    <input id="${id}" data-f="${key}" type="${type === "text" ? "text" : "number"}"${step}
           value="${esc(value)}">`;
}

// One form back into a body for `BagEntryRequest`, or the one sentence saying why it is not one.
// Blank is `null` for a number and `""` for text, which is the contract's own spelling of
// *undeclared* — and the reason nothing here substitutes a zero for a blank.
//
// `scope` is an element and not a selector because a set lookup has seven of these forms in the
// DOM at once; they are told apart by which box they sit in, never by an id.
function readSpec(scope) {
  const body = {};
  for (const [, fields] of SPEC_FIELDS) {
    for (const [key, label, type] of fields) {
      const raw = Array.from(scope.querySelectorAll(`[data-f="${key}"]`))
        .map((el) => el.value.trim());
      if (type === "text") { body[key] = raw[0]; continue; }
      if (type === "bool") { body[key] = raw[0] === "" ? null : raw[0] === "yes"; continue; }
      if (type === "range") {
        if (raw[0] === "" && raw[1] === "") { body[key] = null; continue; }
        if (raw[0] === "" || raw[1] === "") {
          return { error: `${label} needs both ends or neither.` };
        }
        const pair = [Number(raw[0]), Number(raw[1])];
        if (pair.some(Number.isNaN)) return { error: `${label} is not two numbers.` };
        // Caught here rather than at the server, and it is the one place this form is stricter
        // than the route: `ClubSpec._loft_range_is_ordered` *raises* on a reversed pair, so a
        // save would answer 500 instead of a sentence. A typo in a form is not a server error.
        if (pair[0] > pair[1]) {
          return { error: `${label} runs high to low — ${pair[0]} is more than ${pair[1]}.` };
        }
        body[key] = pair;
        continue;
      }
      if (raw[0] === "") { body[key] = null; continue; }
      const value = Number(raw[0]);
      // Refused rather than silently stored as null, which is what JSON.stringify does with a
      // NaN. A loft that quietly went missing is the measurement ADR-024 calls unrecoverable.
      if (Number.isNaN(value)) return { error: `"${raw[0]}" is not a number (${label}).` };
      if (type === "int" && !Number.isInteger(value)) {
        return { error: `${label} is a whole number.` };
      }
      body[key] = value;
    }
  }
  return { body };
}

// One spec value as it reads, or `null` for a field nobody recorded. **The one place this page
// decides what "recorded" means**, because two places would let the read-only table and the
// filled count disagree about the same club — a spec that says "11 of 27" over twelve rows.
//
// `""` and `null` are the contract's two spellings of undeclared, one per field type
// (`ClubSpec`), and they arrive here as the same answer. `false` and `0` are *not* among them:
// a fixed hosel is a recorded fact and zero offset is a measurement, and dropping either into
// the blanks list would report a club as less known than it is.
function specValue(raw) {
  if (raw === null || raw === undefined || raw === "") return null;
  if (typeof raw === "boolean") return raw ? "yes" : "no";
  // `loft_range_deg`, the one pair. Rendered as a span and not as two numbers, because the two
  // ends are one fact about one adjustable hosel.
  if (Array.isArray(raw)) return `${raw[0]} to ${raw[1]}`;
  return String(raw);
}

// How much of a specification actually arrived, said as a number, because the blanks are the
// point: 11 of 27 is a source that would not commit to sixteen fields, and a form with sixteen
// questions still in it.
function filledCount(spec) {
  let filled = 0;
  for (const [, fields] of SPEC_FIELDS) {
    for (const [key] of fields) if (specValue(spec[key]) !== null) filled += 1;
  }
  return filled;
}

// A message that does not cost the form it is about. Every write path here can fail on one value
// the golfer typed, and re-rendering to show that failure would discard the twenty-six fields
// typed beside it — so the banner is an element that is always in the DOM and gets its text set,
// never a branch in a template. M9's five-field form could afford to re-render; this one cannot.
function message(id, text, kind) {
  const el = document.getElementById(id);
  if (!el) return;
  el.className = kind === "error" ? "banner error" : "note";
  el.textContent = text || "";
  el.style.display = text ? "" : "none";
}

function renderBag() {
  const host = document.getElementById("bag-body");
  if (!host) return;
  if (!bagPayload) {
    host.innerHTML = `<div class="banner error">Could not load the bag.</div>`;
    return;
  }

  const clubs = bagPayload.clubs || [];
  // Always emitted and filled in afterwards rather than branched on here, so a failure can be
  // shown without re-rendering the form it is about (`message`).
  const parts = [`<div id="bag-msg" style="display:none"></div>`];

  if (!clubs.length) {
    parts.push(nothingTagged());
  } else {
    parts.push(`<p class="muted">${plural(clubs.length, "club")} with history or a bag entry
      &middot; ${bagPayload.clubs_used} hit, ${bagPayload.clubs_declared} in the bag.</p>`);
    for (const club of clubs) parts.push(clubBlock(club));
    if (bagPayload.untagged_swings) {
      // Never folded into a club. `untagged_swings` is read off the whole corpus, so every
      // narrowing above reports zero by construction — leaving it out would make a bag look
      // complete when most of the golfer's swings are simply missing from it.
      parts.push(`<p class="note">${plural(bagPayload.untagged_swings, "swing")} on record name no
        club, so nothing above counts them. They are not lost — every whole-bag figure further
        down still includes them — but no per-club number can be cut from them until each one is
        tagged.</p>`);
    }
  }

  parts.push(addBlock());
  // The lookup gets its own host and its own render. That is not tidiness: a set lookup takes
  // half a minute (M12 P5), and rebuilding this whole section when it lands would repaint every
  // club row — and any edit form open in one — under the golfer's hands. Only `#lookup` changes
  // while a call is in flight, which is what "must not block the rest of the bag section" means
  // once it is written in DOM.
  parts.push(`<div id="lookup"></div>`);
  host.innerHTML = parts.join("");
  message("bag-msg", bagError, "error");
  renderLookup();
}

// The all-or-nothing silence, and the state on disk today. It gets its own branch because a table
// of refusals and an empty bag look identical from a distance and need opposite responses: one
// says go and hit balls, this one says nothing on disk names a club at all, which no bay session
// fixes on its own. `mcp/club.py:NOTHING_TAGGED` draws the same distinction for a model.
function nothingTagged() {
  const n = bagPayload.untagged_swings;
  const history = n
    ? `All ${plural(n, "swing")} on record name no club.`
    : `There are no swings on record either.`;
  return `<div class="banner warn"><strong>No club has been hit or declared.</strong> ${history}
    This is <em>not</em> a sample-size refusal, and more range balls will not fix it: the club tag
    is newer than these swings. New swings get one from the picker on the upload page, and a
    swing already stored is retagged from the <em>change</em> control on its row in that page's
    swing list &mdash; one swing at a time, because only the person who hit it knows what
    with.</div>`;
}

function clubBlock(club) {
  const editing = editingClub === club.club;
  // Make and model ride on the collapsed row, between the category and the carry. A bag whose
  // rows all read "7i · iron · in the bag, never hit" cannot be checked against the clubs in the
  // hall without opening every one of them, and *is what I declared actually on file* is a
  // question a golfer asks about the whole bag at once. It sits before the headline rather than
  // replacing it: carry is still the number most visits came for (`clubHeadline`).
  const summary = [esc(club.category.replace(/_/g, " ")), declaredName(club), clubHeadline(club)];
  return `<details class="club"${editing ? " open" : ""}>
    <summary><span class="id">${esc(club.club)}</span>
      <span class="muted">${summary.filter(Boolean).join(" &middot; ")}</span></summary>
    <div class="body">
      ${editing ? editForm(club) : entryLine(club) + specTable(club)}
      ${evidenceLine(club)}
      ${(club.caveats || []).map((c) => `<p class="why">${esc(c)}</p>`).join("")}
      ${clubBody(club)}
    </div></details>`;
}

// What the golfer called this club, or nothing at all. Nothing rather than a placeholder: the
// undeclared case already has a sentence of its own further down the row (`entryLine`), and a
// second "not recorded" on the summary line would say it twice about the same club.
function declaredName(club) {
  const entry = club.bag_entry;
  if (!entry) return null;
  const described = [entry.make, entry.model].filter(Boolean).join(" ");
  return described ? esc(described) : null;
}

// The one line most visits came for, on the collapsed row. Carry rather than any other metric,
// because "how far do I hit my 7 iron" is the question this whole milestone was built to answer.
function clubHeadline(club) {
  const carry = (club.metrics || {}).carry_distance_yds;
  if (carry && typeof carry.mean === "number") {
    return `carries ${esc(fmt(carry.mean, carry.unit))} yards over ${plural(carry.n, "shot")}`;
  }
  if (!club.n_swings) return club.in_bag ? "in the bag, never hit" : "no history";
  return `${plural(club.n_swings, "swing")}, no carry average yet`;
}

// All three counters, never one. contracts/club_profile.py opens with why they diverge per club:
// a 7 iron filmed six times with two shot-screen photos is six swings of history and a carry
// ceiling of two, because every launch-monitor claim dedupes on the photograph's hash.
function evidenceLine(club) {
  let text = `${plural(club.n_swings, "swing")}, ${plural(club.n_shots, "shot photo")},
    ${plural(club.n_sessions, "session")}`;
  if (club.n_shots < club.n_swings) {
    text += ` — so every distance and launch figure below is capped at the shot count`;
  }
  return `<p class="muted">${text}</p>`;
}

// The physical club, or what its absence costs — spelled out rather than left blank, because the
// two halves need saying together: it takes nothing away from the distance statistics, and it
// makes every loft or fitting question about this club refuse (ADR-024 §2). What a *declared*
// loft means changed in M12: ADR-026 §1 reversed "never a catalogue default", so a loft here is
// the manufacturer's published one unless the golfer measured it.
function entryLine(club) {
  const entry = club.bag_entry;
  if (!entry) {
    return `<p class="entry none">No bag entry declared. Every statistic below is unaffected; a
      loft or fitting question about this club has to refuse until one is.
      <button data-act="edit" data-club="${esc(club.club)}">Declare</button></p>`;
  }
  const described = [entry.make, entry.model].filter(Boolean).join(" ");
  const bits = [esc(described || "make and model not recorded")];
  bits.push(typeof entry.loft_deg === "number"
    ? `${esc(entry.loft_deg)}&deg; loft` : "loft not recorded");
  if (entry.shaft_model) bits.push(`${esc(entry.shaft_model)} shaft`);
  if (typeof entry.length_in === "number") bits.push(`${esc(entry.length_in)} in`);
  return `<p class="entry">${bits.join(" &middot; ")}
    <span class="muted">(declared ${esc(String(entry.recorded_at).slice(0, 10))})</span>
    <button data-act="edit" data-club="${esc(club.club)}">Edit</button>
    <button data-act="remove" data-club="${esc(club.club)}">Remove</button></p>`;
}

// Every field of the declared club, read-only, in `contracts/club_spec.py`'s own groups. [M12 P8]
//
// The twenty-seven fields have been on this page since P6 — but only inside the *edit* form, and
// only while it is open. So "is my Titleist 7 iron really on file, and what loft did it get"
// could be answered only by pressing Edit and reading the numbers out of input boxes, which is a
// control that says *change this* to someone who wanted to look. Reading and writing are
// different questions asked at different moments; this is the read, and the buttons above it
// stay the write.
//
// **Derived from `SPEC_FIELDS`, never from a second list.** `tests/api/test_career_page.py` pins
// that one constant against `ClubSpec`; a display list written out beside it would be exactly
// the drift that test exists to catch, one surface further out — a field added to the contract
// and to the form, and silently never shown to the golfer who typed it.
function specTable(club) {
  const entry = club.bag_entry;
  if (!entry) return "";
  const parts = [`<div class="spec">`];
  for (const [group, fields] of SPEC_FIELDS) {
    const rows = [];
    const blank = [];
    for (const [key, label] of fields) {
      const value = specValue(entry[key]);
      if (value === null) blank.push(label);
      else rows.push(`<div class="row"><span class="k">${esc(label)}</span>
        <span class="v">${esc(value)}</span></div>`);
    }
    parts.push(`<p class="grp">${esc(group)}</p>`, ...rows);
    // The blanks are named and never merely counted, and never dropped. Sixteen of these fields
    // are empty on a club a model looked up; a table that showed only what it had would read as a
    // complete specification, which is how a golfer comes to believe a loft is on file when
    // nothing knows one. Naming them also says which question to answer next.
    if (blank.length) {
      parts.push(`<p class="blank">not recorded: ${blank.map(esc).join(", ")}</p>`);
    }
  }
  parts.push(`</div>`, provenanceLine(entry));
  return parts.join("");
}

// Where the numbers came from, on the row that shows them. ADR-026 §7's whole point is that a
// loft a model recalled and a loft a golfer read off the manufacturer's own page are not equally
// trustworthy, and a reader who cannot tell them apart has to treat both as the weaker. `notes`
// is where the source says which of its own answers it doubts, and it is shown verbatim — it is
// usually the reason a field listed as blank above is blank.
function provenanceLine(entry) {
  const provenance = entry.provenance;
  const filled = `${filledCount(entry)} of ${SPEC_FIELD_COUNT} fields recorded`;
  if (!provenance) {
    // Not an error and not a gap to fill in: `BagEntry.provenance` is None for an entry declared
    // before anything recorded a source, so this dates the entry rather than doubting it.
    return `<p class="why">${filled}, from a source this entry predates the recording of.</p>`;
  }
  const when = String(provenance.retrieved_at).slice(0, 10);
  return `<p class="why">${filled} &middot; ${esc(provenance.source)}, retrieved
    ${esc(when)}</p>${provenance.notes ? `<p class="why">${esc(provenance.notes)}</p>` : ""}`;
}

// Saving an untouched row is deliberately a no-op on disk: BagStore.set_entry returns without
// writing when nothing changed, so the declared date does not move and no bag-changed caveat is
// raised over shots that were all hit with the same physical club (M9 P3, P16).
//
// M12 P6 widened this from five fields to every field of `ClubSpec`, through the same `specForm`
// a looked-up candidate renders: the typed path and the confirmed-lookup path are one form, so a
// golfer with no API key configured is editing exactly the shape a lookup would have filled in.
function editForm(club) {
  return `<div class="specform">
    ${specForm(`e-${club.club}`, club.bag_entry || {})}
    <div class="actions">
      <button data-act="save" data-club="${esc(club.club)}">Save</button>
      <button data-act="cancel">Cancel</button>
    </div></div>`;
}

function clubBody(club) {
  const metrics = club.metrics || {};
  const names = Object.keys(metrics).sort();
  const note = clubNote(club, names);
  const parts = note ? [`<p class="note">${note}</p>`] : [];
  // metricCard with no third argument, and the omission is load-bearing: there is no per-club
  // tour join to pass. ranges.json holds club_category "all" rows only, so a tour row rendered
  // here would refuse a claim nobody ever intended to make. Reusing the whole-bag renderer is
  // what makes a refusal look identical wherever it came from.
  for (const name of names) parts.push(metricCard(metrics[name], (club.dispersion || {})[name]));
  return parts.join("");
}

// The silences mcp/club.py enumerates, in this page's own voice. The wording differs per surface
// on purpose — the CLI points at a shell command, the MCP note points at a tool, this points at a
// control someone can tap — but the distinctions must not, so that module is where the taxonomy is
// stated and this is a rendering of it. NEVER_HIT has no branch here: a club nobody has hit and
// nobody declared simply has no row, and its absence is the answer.
function clubNote(club, names) {
  if (!club.n_swings) {
    if (!club.in_bag) return null;
    return `In the bag, and nothing hit with it yet. There are no statistics and nothing has been
      refused — that is the state every club is in the day it is declared, and this row exists so
      the club is visible before it has any history.`;
  }
  if (!names.length) {
    return `These swings carry no measurement at all, so there is nothing here to refuse and
      nothing to report. That is not about the club: the commonest causes are swings that were
      never analyzed and swings analyzed by an older engine. The breakdown at the foot of this
      page says which.`;
  }
  if (nothingSayable(club.metrics)) {
    return `Every claim about this club is withheld. The floors are the same ones the whole-bag
      history faces, applied to this club's share of it — a bag hit across a dozen clubs reaches
      them far more slowly than the bag as a whole does. Each row below names what it waits for.`;
  }
  return null;
}

// Only the clubs not already in the bag, in the taxonomy's own order. A club with history that has
// left the bag reappears here, which is right: declaring it again is exactly what putting it back
// in the bag means.
function addBlock() {
  const declared = new Set((bagPayload.clubs || []).filter((c) => c.in_bag).map((c) => c.club));
  const options = clubList.filter((c) => !declared.has(c))
    .map((c) => `<option value="${esc(c)}">${esc(c)}</option>`).join("");
  if (!options) return "";
  return `<p class="muted"><label for="add-club">Add to the bag:</label>
    <select id="add-club">${options}</select>
    <button data-act="add">Declare</button></p>`;
}

// The search box, the pending line and the candidates — everything that changes while a lookup
// runs. Rendered into `#lookup` alone (see `renderBag`), so the wait costs nothing else on screen.
function renderLookup() {
  const host = document.getElementById("lookup");
  if (!host) return;
  host.innerHTML = `${searchRow()}
    <p id="lk-msg" class="note" style="display:none"></p>
    ${lookupResults()}`;
  message("lk-msg", lookupState.message, lookupState.messageKind);
}

// Make, model, year and a slot — or a slot *range*, which is how a set is asked for. The range is
// two pickers over `clubList` rather than free text like "4-PW", because the taxonomy already
// knows its own order and parsing a dash into it would be a second club vocabulary in the page.
function searchRow() {
  if (!clubList.length) return "";
  const options = (selected) => clubList.map((c) =>
    `<option value="${esc(c)}"${c === selected ? " selected" : ""}>${esc(c)}</option>`).join("");
  // Disabled rather than hidden while a call is in flight: a second click would start a second
  // half-minute call whose answer overwrites the first, and the button vanishing under the cursor
  // reads as the page breaking.
  const busy = lookupState.pending ? " disabled" : "";
  return `<p class="muted" style="margin-bottom:0.2rem">Or look up what a club <em>is</em>:</p>
    <div class="search">
      <input id="lk-make" class="make" placeholder="make" aria-label="make"
             value="${esc(lookupState.make)}"${busy}>
      <input id="lk-model" class="model" placeholder="model" aria-label="model"
             value="${esc(lookupState.model)}"${busy}>
      <input id="lk-year" class="year" type="number" step="1" placeholder="year"
             aria-label="model year" value="${esc(lookupState.year)}"${busy}>
      <label for="lk-from">slot</label>
      <select id="lk-from" aria-label="slot"${busy}>${options(lookupState.from)}</select>
      <label for="lk-to">through</label>
      <select id="lk-to" aria-label="through slot"${busy}>
        <option value="">just the one</option>${options(lookupState.to)}</select>
      <button data-act="lookup"${busy}>Look up</button>
    </div>`;
}

function lookupResults() {
  if (lookupState.pending) {
    const n = lookupState.slots.length;
    return `<p class="note">Looking up ${n === 1 ? esc(lookupState.slots[0])
      : plural(n, "slot")}. Half a minute is normal and a set takes longer, because what is being
      asked is a model and not a database. Nothing else on this page is waiting for it.</p>`;
  }
  if (lookupState.candidates === null) return "";

  const parts = [];
  if (lookupState.note) parts.push(`<p class="why">${esc(lookupState.note)}</p>`);
  const answered = new Set(lookupState.candidates.map((c) => c.spec.club));
  const missing = lookupState.slots.filter((slot) => !answered.has(slot));
  if (missing.length) {
    // A refusal, said as one. `look_up_club` returns no row for a slot it will not commit to, and
    // the golfer needs to know the difference between that and a slot it never asked about.
    parts.push(`<p class="why">Nothing came back for ${esc(missing.join(", "))}. That is the
      source declining rather than failing, and the club can still be declared from the picker
      above and filled in by hand.</p>`);
  }
  if (!lookupState.candidates.length) return parts.join("");

  parts.push(`<p class="why">A blank below is a field the source would not commit to. Fill it in
    if you know it and leave it blank if you do not &mdash; blank is recorded as nobody knowing,
    where a zero would be recorded as a measurement.</p>`);
  lookupState.candidates.forEach((c, i) => parts.push(candidateBlock(c, i)));
  parts.push(`<div class="actions">
    <button data-act="confirm">Add ${plural(lookupState.candidates.length, "club")} to the
      bag</button>
    <button data-act="discard">Discard</button></div>`);
  return parts.join("");
}

// One slot's proposal, as the editable form it will be saved from. The provenance line is not
// decoration: it is the difference between a number a person read off a manufacturer's page and
// one a model recalled, and ADR-026 §7 exists because a reader who cannot tell them apart has to
// treat both as the weaker. `notes` is where the model says which of its own answers it doubts.
function candidateBlock(candidate, index) {
  const spec = candidate.spec;
  const provenance = candidate.provenance || {};
  const source = provenance.source || "an unnamed source";
  const bits = [candidate.served_from === "catalogue"
    ? `kept from an earlier confirmation, first from ${source}`
    : `from ${source}`];
  bits.push(`${filledCount(spec)} of ${SPEC_FIELD_COUNT} fields filled`);
  if ((bagPayload.clubs || []).some((c) => c.club === spec.club && c.in_bag)) {
    bits.push("already in the bag, so saving replaces that entry");
  }
  return `<div class="cand" data-row="${index}" data-club="${esc(spec.club)}">
    <p class="chead"><span class="id">${esc(spec.club)}</span>
      <span class="muted">${bits.map(esc).join(" &middot; ")}</span></p>
    ${provenance.notes ? `<p class="why">${esc(provenance.notes)}</p>` : ""}
    ${specForm(`c-${index}`, spec)}
  </div>`;
}

// Ask the route. Writes nothing on its own — what comes back is a proposal, and the confirm below
// is what turns it into a declaration (ADR-026 §5).
async function doLookup() {
  const value = (id) => document.getElementById(id).value.trim();
  const from = document.getElementById("lk-from").value;
  const to = document.getElementById("lk-to").value;
  const first = clubList.indexOf(from);
  const last = to ? clubList.indexOf(to) : first;
  Object.assign(lookupState, {
    make: value("lk-make"), model: value("lk-model"), year: value("lk-year"),
    from, to, note: "", candidates: null, message: "", messageKind: "note",
  });
  if (last < first) {
    // The taxonomy runs driver to putter, so a set always reads long club first. Refused rather
    // than sorted, because a golfer who picked them backwards may have picked the wrong two.
    lookupState.message = `a set runs from the longer club to the shorter one, and ${to} comes
      before ${from} in the bag.`;
    lookupState.messageKind = "error";
    renderLookup();
    return;
  }
  lookupState.slots = clubList.slice(first, last + 1);
  lookupState.pending = true;
  renderLookup();

  const body = { make: lookupState.make, model: lookupState.model,
    model_year: lookupState.year === "" ? null : Number(lookupState.year) };
  // One call for a set, never one per slot: it is what keeps a loft progression internally
  // consistent, and `look_up_set` exists for that reason (ADR-026 §2).
  if (lookupState.slots.length === 1) body.club = lookupState.slots[0];
  else body.slots = lookupState.slots;

  try {
    const res = await fetch("/api/clubs/lookup", {
      method: "POST",
      headers: { ...authHeaders(), "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const payload = await res.json().catch(() => ({}));
    if (!res.ok) {
      lookupState.message = detailOf(payload, res.status, "that lookup did not run");
      lookupState.messageKind = "error";
    } else {
      lookupState.candidates = payload.candidates || [];
      lookupState.note = payload.note || "";
    }
  } catch (err) {
    lookupState.message = `Could not reach the server: ${err.message}`;
    lookupState.messageKind = "error";
  }
  lookupState.pending = false;
  renderLookup();
}

// One confirm, N writes, and they go one at a time. `BagStore` reads, mutates and writes the
// golfer's whole bag file per call, so seven concurrent posts would each write a file read before
// the other six landed and most of the set would vanish — the sequence is a correctness
// requirement here and not politeness to the server.
async function confirmLookup() {
  const rows = Array.from(document.querySelectorAll("#lookup .cand"));
  const jobs = [];
  for (const row of rows) {
    const read = readSpec(row);
    if (read.error) {
      // Deliberately not a re-render: every other row is holding values the golfer typed.
      message("lk-msg", `${row.dataset.club}: ${read.error}`, "error");
      return;
    }
    const candidate = lookupState.candidates[Number(row.dataset.row)];
    // What was typed replaces what was proposed, so a re-render after a partial failure shows the
    // golfer their own edits back rather than quietly reverting them to the source's answer.
    candidate.spec = { ...candidate.spec, ...read.body };
    // The provenance is echoed back verbatim rather than composed here, which is what carries the
    // model id and its own confidence notes into the bag. It covers the whole row even where a
    // field was edited; per-field provenance is the fix and is deferred (M12 P5 *As built*).
    jobs.push([row.dataset.club, { ...read.body, provenance: candidate.provenance || null }]);
  }

  message("lk-msg", `Saving ${plural(jobs.length, "club")}...`, "note");
  const landed = [];
  const failed = [];
  for (const [club, body] of jobs) {
    const detail = await write(club, "POST", body);
    if (detail) failed.push(`${club} (${detail})`);
    else landed.push(club);
  }

  // A partial failure leaves a partially declared bag and says which slots landed, which is the
  // honest outcome of six writes and one refusal. The rows that landed leave the panel; the rest
  // stay open, carrying what was typed, to be fixed and confirmed again.
  if (failed.length) {
    lookupState.candidates = lookupState.candidates.filter((c) => !landed.includes(c.spec.club));
    lookupState.slots = lookupState.slots.filter((slot) => !landed.includes(slot));
    lookupState.message = `${landed.length ? `${landed.join(", ")} saved. ` : ""}Not saved:
      ${failed.join("; ")}`;
    lookupState.messageKind = "error";
  } else {
    Object.assign(lookupState, {
      candidates: null, slots: [], note: "", messageKind: "note",
      message: `${plural(landed.length, "club")} saved: ${landed.join(", ")}.`,
    });
  }
  bagError = null;
  renderBag();
}

async function onBagClick(event) {
  const button = event.target.closest("button[data-act]");
  if (!button) return;
  // Inside a <summary>, a button click would also toggle the details open or shut.
  event.preventDefault();
  const { act, club } = button.dataset;
  bagError = null;
  message("bag-msg", "");

  if (act === "edit") { editingClub = club; renderBag(); return; }
  if (act === "cancel") { editingClub = null; renderBag(); return; }

  // The three lookup branches. None of them touches `editingClub` or re-renders the club rows: an
  // open edit form and an open lookup are two different acts, and neither is a reason to discard
  // the other's typing.
  if (act === "lookup") { await doLookup(); return; }
  if (act === "confirm") { await confirmLookup(); return; }
  if (act === "discard") {
    Object.assign(lookupState, { candidates: null, slots: [], note: "", message: "" });
    renderLookup();
    return;
  }

  if (act === "add") {
    const select = document.getElementById("add-club");
    if (!select) return;
    // Declared empty and then opened for editing, rather than the other way round: putting a club
    // in the bag and recording what it measures are two acts, and BagEntry lets the second wait —
    // a golfer who has never had their lofts measured still has a bag (ADR-024 §2).
    bagError = await write(select.value, "POST", {}) || null;
    if (!bagError) editingClub = select.value;
    renderBag();
    return;
  }

  if (act === "remove") {
    if (!confirm(`Take the ${club} out of the bag? Every shot hit with it is kept.`)) return;
    bagError = await write(club, "DELETE", null) || null;
    if (!bagError) editingClub = null;
    renderBag();
    return;
  }

  if (act === "save") {
    // One form is open at a time, so this selector is unambiguous; `editingClub` holds a single
    // value rather than a set for exactly that reason. A candidate form is never picked up here:
    // it lives under `#lookup` and is saved by its own confirm.
    const read = readSpec(document.querySelector("#bag .specform"));
    if (read.error) {
      // Shown without a re-render, because the other twenty-six fields are still typed in.
      bagError = read.error;
      message("bag-msg", bagError, "error");
      return;
    }
    bagError = await write(club, "POST", read.body) || null;
    if (!bagError) editingClub = null;
    renderBag();
  }
}

// The one place this page writes. Both verbs return the whole bag, which is why nothing here
// refetches: a save and a reload cannot disagree, and the bag-changed caveat that declaring an
// entry is what creates arrives with the response rather than on the next visit.
//
// **Returns "" on success and the server's own sentence on failure**, rather than setting
// `bagError` itself as it did in M9. A set fan-out posts N times and can say nothing until all N
// are back — "4i and 5i landed, 6i did not" is one message about several writes — so the failure
// comes back to the caller and the caller decides what one of it among several means.
async function write(club, method, body) {
  const url = `/api/golfers/${encodeURIComponent(playerId)}/bag/${encodeURIComponent(club)}`;
  try {
    const res = await fetch(url, {
      method,
      headers: body === null ? authHeaders()
        : { ...authHeaders(), "Content-Type": "application/json" },
      body: body === null ? undefined : JSON.stringify(body),
    });
    const payload = await res.json().catch(() => ({}));
    if (!res.ok) return detailOf(payload, res.status, "that did not save");
    bagPayload = payload;
    return "";
  } catch (err) {
    return `Could not reach the server: ${err.message}`;
  }
}

// `detail` verbatim: the server's refusals are written for a human — "'wedge' is not a club in the
// bag" names what to type next, where a bare status code names nothing.
//
// A 422 answers with a *list* of pydantic errors instead of a sentence, and rendering that gives
// the golfer "[object Object]". M9's five text fields could not produce one; a form carrying every
// typed field of `ClubSpec` can, so the shape is checked rather than assumed.
function detailOf(payload, status, fallback) {
  const detail = payload && payload.detail;
  if (typeof detail === "string" && detail) return detail;
  if (Array.isArray(detail) && detail.length) {
    const first = detail[0] || {};
    const where = Array.isArray(first.loc) ? first.loc[first.loc.length - 1] : "";
    return `${where ? `${where}: ` : ""}${first.msg || "that is not a value this accepts"}`;
  }
  return `${fallback} (${status})`;
}

load();
</script>
</body>
</html>

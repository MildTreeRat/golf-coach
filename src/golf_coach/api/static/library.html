<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Golf Coach Library</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; margin: 0; padding: 1.25rem; max-width: 640px; }
  h1 { font-size: 1.1rem; margin: 0 0 0.15rem; }
  a.back { font-size: 0.85rem; }
  .muted { opacity: 0.6; }
  .sub { font-size: 0.85rem; opacity: 0.65; margin: 0 0 1rem; }
  .banner { padding: 0.7rem 0.85rem; border-radius: 8px; margin-top: 1rem; font-size: 0.9rem; }
  .banner.warn { background: rgba(220,160,40,0.18); border: 1px solid rgba(220,160,40,0.5); }
  .banner.error { background: rgba(200,60,60,0.18); border: 1px solid rgba(200,60,60,0.5); }
  .banner.info { background: rgba(128,128,128,0.15); }

  /* The golfer filter. Chips rather than a <select> for the same reason the club picker at the
     bay is chips: this page is opened on a phone, one-handed, standing up. */
  .filters { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-bottom: 1.1rem; }
  .filters button { font: inherit; font-size: 0.8rem; padding: 0.3rem 0.65rem;
                    border-radius: 999px; border: 1px solid rgba(128,128,128,0.45);
                    background: transparent; color: inherit; cursor: pointer; }
  .filters button[aria-pressed="true"] { border-color: rgba(90,120,200,0.9);
                                         background: rgba(90,120,200,0.18); font-weight: 600; }

  h2.session { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em;
               opacity: 0.6; margin: 1.5rem 0 0.5rem; display: flex;
               justify-content: space-between; align-items: baseline; gap: 0.6rem; }
  h2.session .n { font-weight: 400; letter-spacing: 0; text-transform: none; }

  .swing { border-top: 1px solid rgba(128,128,128,0.25); padding: 0.6rem 0; }
  .swing .top { display: flex; align-items: baseline; gap: 0.5rem; }
  .swing .id { font-weight: 600; font-size: 0.95rem; }
  /* Tabular numerals so a column of scores lines up under the eye rather than shimmering. */
  .swing .score { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 0.95rem; }
  .swing .score.none { font-weight: 400; opacity: 0.55; font-size: 0.85rem; }
  .swing .tags { margin-left: auto; display: flex; gap: 0.3rem; flex-wrap: wrap; }
  .swing .tag { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.04em;
                border: 1px solid rgba(128,128,128,0.45); border-radius: 4px;
                padding: 0.02rem 0.3rem; opacity: 0.8; }
  .swing .tag.warn { border-color: rgba(220,160,40,0.7); }
  .swing .headline { font-size: 0.85rem; margin: 0.3rem 0 0; opacity: 0.85; }
  .swing .acts { display: flex; gap: 0.8rem; margin-top: 0.4rem; font-size: 0.85rem;
                 align-items: baseline; }
  .swing button.link { font: inherit; font-size: 0.85rem; background: none; border: none;
                       padding: 0; color: inherit; text-decoration: underline; cursor: pointer; }
  .swing button.link[disabled] { text-decoration: none; opacity: 0.45; cursor: default; }
  video { width: 100%; border-radius: 8px; background: #000; margin-top: 0.5rem; }
</style>
</head>
<body>
<a class="back" href="/">&larr; Upload</a>
<h1>Swing library</h1>
<div id="root"><p class="muted">Loading...</p></div>

<script>
const TOKEN_KEY = "golf_coach_token";
const root = document.getElementById("root");

// Which golfer is being shown (null = everyone) and which swing has its player open. Both are
// page state rather than URL state on purpose: this page is a way *in* to a swing, and a
// half-filtered library is not a thing worth being able to send someone.
let payload = null;
let golfers = {};          // player_id -> the /api/golfers record, for display names only
let filter = null;
let playing = null;        // "session/swing" of the row whose <video> is open, at most one

function token() { return localStorage.getItem(TOKEN_KEY); }
function authHeaders() {
  const t = token();
  return t ? { "X-Upload-Token": t } : {};
}

// A <video> element sends no custom headers, so the token has to ride in the query string.
// The guard accepts either (ADR-016). Same rule results.html plays by.
function videoUrl(sessionId, swingId, name) {
  const base = `/api/sessions/${encodeURIComponent(sessionId)}/swings/${encodeURIComponent(swingId)}/video/${name}`;
  const t = token();
  return t ? `${base}?t=${encodeURIComponent(t)}` : base;
}

function esc(value) {
  return String(value).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
}

function plural(n, word) { return `${n} ${word}${n === 1 ? "" : "s"}`; }

function golferName(playerId) {
  if (!playerId) return null;
  return golfers[playerId] ? golfers[playerId].display_name : playerId;
}

async function load() {
  let sessionsRes, golfersRes;
  try {
    // Two routes in one trip; neither depends on the other's answer. The golfer list is only
    // needed to turn a stored `player_id` into the name someone recognises, so a failure there
    // degrades to showing the id rather than failing the page.
    [sessionsRes, golfersRes] = await Promise.all([
      fetch("/api/sessions", { headers: authHeaders() }),
      fetch("/api/golfers", { headers: authHeaders() }),
    ]);
  } catch (err) {
    root.innerHTML = `<div class="banner error">Could not load: ${esc(err.message)}</div>`;
    return;
  }
  if (sessionsRes.status === 401) {
    root.innerHTML = `<div class="banner error">This phone isn't set up. Reopen the setup
      link (the one ending in /?t=...) to register it.</div>`;
    return;
  }
  // A 404 here has one overwhelmingly likely cause and it is worth naming rather than reporting
  // as a generic failure: the server process is older than this page. `StaticFiles` reads from
  // disk on every request, so a running server picks up a new *page* the moment it is written
  // and can still be missing the *route* the page calls — which looks, from the browser, like
  // the page silently not working.
  if (sessionsRes.status === 404) {
    root.innerHTML = `<div class="banner error">This server has no <code>/api/sessions</code>
      route, so it was started before the library page existed. Restart it
      (<code>scripts/run_server.py</code>) and reload.</div>`;
    return;
  }
  if (!sessionsRes.ok) {
    root.innerHTML = `<div class="banner error">The server answered
      ${sessionsRes.status} for /api/sessions.</div>`;
    return;
  }

  // Everything past here used to sit outside the try, which is how a 404 became a page stuck on
  // "Loading..." forever: `res.json()` threw on the error body, the rejection escaped `load()`,
  // and nothing was left to write a message into the DOM. Anything that can throw now reports.
  try {
    payload = await sessionsRes.json();
    if (golfersRes.ok) {
      const list = (await golfersRes.json()).golfers || [];
      golfers = Object.fromEntries(list.map((g) => [g.player_id, g]));
    }
    render();
  } catch (err) {
    root.innerHTML = `<div class="banner error">Could not read the swing list:
      ${esc(err.message)}</div>`;
  }
}

// Every golfer who actually appears in the library, plus the unattributed bucket if there is
// one. Derived from the swings rather than from /api/golfers: a registered golfer with nothing
// on disk is a chip that filters to an empty page.
function golferChips() {
  const seen = new Map();
  let unattributed = 0;
  for (const session of payload.sessions) {
    for (const swing of session.swings) {
      if (swing.player_id) seen.set(swing.player_id, (seen.get(swing.player_id) || 0) + 1);
      else unattributed += 1;
    }
  }
  if (seen.size <= 1 && !unattributed) return "";
  const chip = (value, label, n) =>
    `<button type="button" data-filter="${value === null ? "" : esc(value)}"
      aria-pressed="${filter === value}">${esc(label)} <span class="muted">${n}</span></button>`;
  const total = [...seen.values()].reduce((a, b) => a + b, 0) + unattributed;
  const chips = [chip(null, "Everyone", total)];
  for (const [playerId, n] of seen) chips.push(chip(playerId, golferName(playerId), n));
  if (unattributed) chips.push(chip("__none__", "Unassigned", unattributed));
  return `<div class="filters">${chips.join("")}</div>`;
}

function keeps(swing) {
  if (filter === null) return true;
  if (filter === "__none__") return !swing.player_id;
  return swing.player_id === filter;
}

function render() {
  if (!payload.sessions.length) {
    root.innerHTML = `<div class="banner info">Nothing filmed yet. Swings show up here once a
      bundle has been uploaded from the bay.</div>`;
    return;
  }

  const sessions = payload.sessions
    .map((s) => ({ session_id: s.session_id, swings: s.swings.filter(keeps) }))
    .filter((s) => s.swings.length);

  const total = sessions.reduce((n, s) => n + s.swings.length, 0);
  const sub = `<p class="sub">${plural(total, "swing")} across
    ${plural(sessions.length, "session")}, newest first.</p>`;

  const body = sessions.length
    ? sessions.map(renderSession).join("")
    : `<div class="banner info">No swings for that golfer.</div>`;

  root.innerHTML = sub + golferChips() + body;
}

function renderSession(session) {
  // Newest swing first inside the session too. The API sends the store's order, which is
  // oldest-first because that is the order the bay fills them in; a library is read the other way.
  const swings = [...session.swings].reverse()
    .map((swing) => renderSwing(session.session_id, swing)).join("");
  return `<h2 class="session"><span>${esc(session.session_id)}</span>
    <span class="n">${plural(session.swings.length, "swing")}</span></h2>${swings}`;
}

function renderSwing(sessionId, swing) {
  const a = swing.analysis || {};
  const key = `${sessionId}/${swing.swing_id}`;
  const href = `/results.html?session=${encodeURIComponent(sessionId)}&swing=${encodeURIComponent(swing.swing_id)}`;

  const score = typeof a.score === "number"
    ? `<span class="score">${a.score.toFixed(0)}</span><span class="muted">/100</span>`
    : `<span class="score none">${esc(statusWord(swing, a))}</span>`;

  const tags = [];
  const who = golferName(swing.player_id);
  if (who) tags.push(`<span class="tag">${esc(who)}</span>`);
  if (swing.club) tags.push(`<span class="tag">${esc(swing.club)}</span>`);
  // A partial analysis scored fewer fundamentals than a complete one, so its score means
  // something different — that has to be visible in a list where scores sit next to each other.
  if (a.partial) tags.push(`<span class="tag warn">partial</span>`);

  const headline = a.headline ? `<p class="headline">${esc(a.headline)}</p>` : "";

  return `<div class="swing">
    <div class="top"><span class="id">Swing ${esc(swing.swing_id)}</span>${score}
      <span class="tags">${tags.join("")}</span></div>
    ${headline}
    <div class="acts">${watchControl(sessionId, swing, a)}
      <a href="${href}">Open results &rarr;</a></div>
    ${playing === key ? player(sessionId, swing, a) : ""}
  </div>`;
}

function statusWord(swing, a) {
  if (a.status === "queued" || a.status === "running") return "analyzing…";
  if (a.status === "failed") return "analysis failed";
  if (swing.status === "complete") return "not analyzed";
  return `incomplete (${swing.status})`;
}

// The watch button is offered only when the sidecar actually names a render. The fallback to a
// raw clip that results.html does is deliberately *not* repeated here: those uploads are HEVC in
// a QuickTime container and most browsers will not decode them, so a play button over one is a
// button that does nothing. Saying there is no video is more use than a black rectangle.
function watchControl(sessionId, swing, a) {
  const key = `${sessionId}/${swing.swing_id}`;
  if (!a.has_video) {
    return `<button type="button" class="link" disabled
      title="No aligned render recorded for this swing">no video</button>`;
  }
  const open = playing === key;
  return `<button type="button" class="link watch" data-key="${esc(key)}">${
    open ? "Hide video" : "▶ Watch"}</button>`;
}

function player(sessionId, swing, a) {
  // One <video> at a time, created only for the row that was tapped: these renders are ~10 MB
  // each and a library holds every one of them. That is also why a "preview them all" grid is
  // not what this page is — it would be a hundred megabytes to show a screen.
  const warn = a.video_codec === "mp4v"
    ? `<div class="banner warn">This clip is MPEG-4 Part 2, which most browsers will not play.
       Open the results page to download it.</div>`
    : "";
  return `<video controls playsinline autoplay muted loop preload="metadata"
    src="${videoUrl(sessionId, swing.swing_id, "aligned")}"></video>${warn}`;
}

root.addEventListener("click", (event) => {
  const chip = event.target.closest("[data-filter]");
  if (chip) {
    const value = chip.getAttribute("data-filter");
    filter = value === "" ? null : value;
    playing = null;   // a row that filtered away should not keep playing behind the new list
    render();
    return;
  }
  const watch = event.target.closest("button.watch");
  if (watch) {
    const key = watch.getAttribute("data-key");
    playing = playing === key ? null : key;
    render();
  }
});

load();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Golf Coach Results</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; margin: 0; padding: 1.25rem; max-width: 480px; }
  h1 { font-size: 1.1rem; margin: 0 0 0.25rem; }
  h2 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em;
       opacity: 0.6; margin: 1.5rem 0 0.5rem; }
  a.back { font-size: 0.85rem; }
  .score { font-size: 2.4rem; font-weight: 700; line-height: 1; margin: 0.75rem 0 0.25rem; }
  .score small { font-size: 0.9rem; font-weight: 400; opacity: 0.7; }
  .headline { margin: 0.5rem 0 0; font-size: 0.95rem; }
  .banner { padding: 0.7rem 0.85rem; border-radius: 8px; margin-top: 1rem; font-size: 0.9rem; }
  .banner.warn { background: rgba(220,160,40,0.18); border: 1px solid rgba(220,160,40,0.5); }
  .banner.error { background: rgba(200,60,60,0.18); border: 1px solid rgba(200,60,60,0.5); }
  .banner.info { background: rgba(128,128,128,0.15); }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  th { text-align: left; font-weight: 600; opacity: 0.6; padding: 0.2rem 0.3rem; }
  td { padding: 0.35rem 0.3rem; border-top: 1px solid rgba(128,128,128,0.25); }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .pass { color: #2a7; font-weight: 600; }
  .miss { color: #c93; font-weight: 600; }
  ul.notes { margin: 0; padding-left: 1.1rem; font-size: 0.87rem; }
  ul.notes li { margin-bottom: 0.35rem; }
  .tip { border-left: 3px solid #999; padding: 0.4rem 0 0.4rem 0.6rem; margin-bottom: 0.7rem;
         font-size: 0.88rem; }
  .tip.major { border-color: #c33; }
  .tip.minor { border-color: #c93; }
  .tip.info  { border-color: #2a7; }
  .sev { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; opacity: 0.65;
         display: block; margin-bottom: 0.15rem; }
  /* Deliberately not a .tip: a written paragraph and a measured checkpoint must not share a
     visual language, or the prose reads as a fourth measurement. No left border, a tinted card
     instead, and the attribution sits above the text rather than under it. */
  .coach { background: rgba(90,120,200,0.12); border: 1px solid rgba(90,120,200,0.35);
           border-radius: 8px; padding: 0.7rem 0.85rem; font-size: 0.9rem; }
  .coach p { margin: 0 0 0.6rem; }
  .coach p:last-child { margin-bottom: 0; }
  .coach .by { font-size: 0.75rem; opacity: 0.7; margin-bottom: 0.5rem; }
  /* Follow-ups (ADR-020). Shares `.coach`'s tint on purpose — both are written prose from the
     same model, and the distinction that matters on this page is prose vs. measurement, not
     paragraph vs. conversation. The question bubbles are plain so the golfer's own words never
     look like something the system asserted. */
  .ask { margin-top: 0.5rem; }
  .ask .turn { font-size: 0.9rem; margin-bottom: 0.6rem; }
  .ask .turn.you { opacity: 0.75; }
  .ask .turn.you .who { font-weight: 600; }
  .ask .turn.coach { background: rgba(90,120,200,0.12);
                     border: 1px solid rgba(90,120,200,0.35);
                     border-radius: 8px; padding: 0.6rem 0.75rem; }
  .ask .turn p { margin: 0 0 0.5rem; }
  .ask .turn p:last-child { margin-bottom: 0; }
  .ask .who { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em;
              opacity: 0.65; display: block; margin-bottom: 0.15rem; }
  .ask form { display: flex; gap: 0.4rem; margin-top: 0.6rem; }
  .ask input { flex: 1; min-width: 0; font: inherit; font-size: 0.9rem; padding: 0.45rem 0.55rem;
               border: 1px solid rgba(128,128,128,0.45); border-radius: 6px;
               background: transparent; color: inherit; }
  .ask button { font: inherit; font-size: 0.9rem; padding: 0.45rem 0.8rem; border-radius: 6px;
                border: 1px solid rgba(128,128,128,0.45); background: transparent;
                color: inherit; cursor: pointer; }
  .ask button[disabled] { opacity: 0.5; cursor: default; }
  .ask .tools { font-size: 0.7rem; opacity: 0.55; font-family: ui-monospace, monospace;
                margin-bottom: 0.3rem; }
  /* Against your own history. Visually a sibling of the measurements table it sits under, not of
     the checkpoint table above it: a personal center is not a band, and nothing here is scored. */
  .hist { font-size: 0.85rem; }
  .hist .m { display: flex; justify-content: space-between; gap: 0.6rem;
             border-top: 1px solid rgba(128,128,128,0.2); padding: 0.3rem 0; }
  .hist .m:first-child { border-top: none; }
  .hist .name { font-family: ui-monospace, monospace; font-size: 0.8rem; }
  .hist .v { font-variant-numeric: tabular-nums; text-align: right; }
  .hist .v em { font-style: normal; opacity: 0.6; font-size: 0.78rem; display: block;
                font-variant-numeric: normal; }
  /* Population placements. A sibling of `.hist` and deliberately not of the checkpoint table:
     both say where a number sits against a distribution, and neither is a verdict. The one thing
     that must never happen here is a placement borrowing the panel's pass/miss colours — a
     distance from a tour population is not a fault, and `#c93` on `tour_trajectory_q_dtl` would
     assert exactly the thing no band exists to support. So the uncalibrated flag is grey: it is
     a statement about how well we know the number, not about the swing. */
  .plc { font-size: 0.85rem; }
  .plc .vw { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; opacity: 0.55;
             margin: 0.7rem 0 0.1rem; }
  .plc .vw:first-child { margin-top: 0; }
  .plc .p { border-top: 1px solid rgba(128,128,128,0.2); padding: 0.4rem 0; }
  .plc .top { display: flex; justify-content: space-between; gap: 0.6rem; align-items: baseline; }
  .plc .name { font-family: ui-monospace, monospace; font-size: 0.8rem; }
  .plc .v { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
  .plc .v .u { opacity: 0.6; font-size: 0.78rem; margin-left: 0.2rem; }
  .plc .flag { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.04em;
               border: 1px solid rgba(128,128,128,0.5); border-radius: 4px; opacity: 0.75;
               padding: 0.02rem 0.25rem; margin-left: 0.35rem; }
  .plc .d { opacity: 0.7; font-size: 0.8rem; margin: 0.15rem 0 0; }
  /* The tempo trainer (ADR-023). The one block on this page that asks for a swing back rather
     than reporting on one, so it is styled as a control panel and not as a reading: a tinted card
     like `.coach`, because both are things the system offers rather than things it measured, but
     warm rather than blue so a golfer never confuses a metronome with written advice.

     The beat strip is proportional to the real intervals, which is why `flex-grow` carries the
     gap and no width is written here — a 3.4x difference between the backswing and the downswing
     is the whole reason two patterns exist, and a strip that drew them equal would contradict the
     thing it is illustrating. */
  .tempo { background: rgba(200,150,60,0.12); border: 1px solid rgba(200,150,60,0.4);
           border-radius: 8px; padding: 0.7rem 0.85rem; font-size: 0.88rem; }
  .tempo p { margin: 0 0 0.6rem; }
  .tempo .why { font-size: 0.85rem; }
  .tempo .modes { display: flex; gap: 0.4rem; margin-bottom: 0.6rem; }
  .tempo .modes button { font: inherit; font-size: 0.8rem; padding: 0.3rem 0.6rem;
                         border-radius: 6px; border: 1px solid rgba(128,128,128,0.45);
                         background: transparent; color: inherit; cursor: pointer; flex: 1; }
  .tempo .modes button[aria-pressed="true"] { border-color: rgba(200,150,60,0.9);
                                              background: rgba(200,150,60,0.2);
                                              font-weight: 600; }
  .tempo .strip { display: flex; align-items: flex-end; height: 2.2rem; margin: 0.5rem 0 0.2rem;
                  gap: 2px; }
  .tempo .strip .b { width: 3px; border-radius: 2px; background: currentColor; flex: none; }
  .tempo .strip .b.takeaway, .tempo .strip .b.top, .tempo .strip .b.impact { height: 100%;
                                                                            opacity: 0.9; }
  /* Grid filler, drawn as quietly as it is played. */
  .tempo .strip .b.subdivision { height: 45%; opacity: 0.35; }
  .tempo .strip .gap { flex-grow: 1; }
  .tempo .legend { display: flex; justify-content: space-between; font-size: 0.72rem;
                   opacity: 0.6; margin-bottom: 0.6rem; }
  .tempo .controls { display: flex; gap: 0.5rem; align-items: center; }
  .tempo .controls button.play { font: inherit; font-size: 0.9rem; padding: 0.45rem 0.9rem;
                                 border-radius: 6px; border: 1px solid rgba(128,128,128,0.45);
                                 background: transparent; color: inherit; cursor: pointer; }
  .tempo .controls label { font-size: 0.78rem; opacity: 0.7; display: flex; gap: 0.35rem;
                           align-items: center; flex: 1; }
  .tempo .controls input[type=range] { flex: 1; min-width: 0; }
  .tempo .facts { font-size: 0.78rem; opacity: 0.7; margin: 0.55rem 0 0;
                  font-variant-numeric: tabular-nums; }
  .tempo .anchor { font-size: 0.76rem; opacity: 0.75; margin: 0.3rem 0 0; }
  .tempo .src { font-size: 0.72rem; opacity: 0.55; margin: 0.3rem 0 0; }
  details.measured { margin-top: 1.5rem; font-size: 0.85rem; }
  details.measured summary { cursor: pointer; font-size: 0.8rem; text-transform: uppercase;
                             letter-spacing: 0.06em; opacity: 0.6; }
  details.measured table { margin-top: 0.5rem; }
  .shot { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.4rem 0.8rem;
          font-size: 0.87rem; }
  .shot div { display: flex; justify-content: space-between;
              border-bottom: 1px solid rgba(128,128,128,0.2); padding-bottom: 0.2rem; }
  .shot span:last-child { font-variant-numeric: tabular-nums; font-weight: 600; }
  video { width: 100%; border-radius: 8px; background: #000; margin-top: 0.25rem; }
  .muted { opacity: 0.65; font-size: 0.83rem; }
</style>
</head>
<body>
<a class="back" href="/">&larr; Upload</a>
<div id="root"><p class="muted">Loading...</p></div>

<script>
const TOKEN_KEY = "golf_coach_token";
const params = new URLSearchParams(location.search);
const sessionId = params.get("session");
const swingId = params.get("swing");
const root = document.getElementById("root");

function token() { return localStorage.getItem(TOKEN_KEY); }
function authHeaders() {
  const t = token();
  return t ? { "X-Upload-Token": t } : {};
}

// A <video> element sends no custom headers, so the token has to ride in the query string.
// The guard accepts either (ADR-016).
function videoUrl(name) {
  const base = `/api/sessions/${encodeURIComponent(sessionId)}/swings/${encodeURIComponent(swingId)}/video/${name}`;
  const t = token();
  return t ? `${base}?t=${encodeURIComponent(t)}` : base;
}

function esc(value) {
  return String(value).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
}

function num(value, digits = 2) {
  if (typeof value !== "number") return "-";
  const fixed = value.toFixed(digits);
  return fixed.includes(".") ? fixed.replace(/0+$/, "").replace(/\.$/, "") : fixed;
}

function roleName(role) { return role.replace(/_/g, "-"); }

async function load() {
  if (!sessionId || !swingId) {
    root.innerHTML = `<div class="banner error">No swing selected. Go back and pick one.</div>`;
    return;
  }
  let payload;
  try {
    const res = await fetch(
      `/api/sessions/${encodeURIComponent(sessionId)}/swings/${encodeURIComponent(swingId)}`,
      { headers: authHeaders() });
    if (res.status === 401) {
      root.innerHTML = `<div class="banner error">This phone isn't set up. Reopen the setup
        link (the one ending in /?t=...) to register it.</div>`;
      return;
    }
    if (res.status === 404) {
      root.innerHTML = `<div class="banner error">No swing ${esc(swingId)} in session
        ${esc(sessionId)}.</div>`;
      return;
    }
    payload = await res.json();
  } catch (err) {
    root.innerHTML = `<div class="banner error">Could not load: ${esc(err.message)}</div>`;
    return;
  }
  render(payload);
  // Fetched after the render rather than before it, and injected into a placeholder: the swing
  // is what this page is about, and one slow corpus read must not hold back the score.
  loadHistory(payload);
  // Same after-render shape: the swing's thread is looked up server-side and dropped into the
  // ask panel, so a reload picks it back up (ADR-020) rather than showing an empty box.
  loadConversation(payload);

  // Opened straight from a link while the worker is still going: keep checking rather than
  // making the user pull to refresh.
  const status = payload.analysis && payload.analysis.status;
  if (status === "queued" || status === "running") setTimeout(load, 5000);
}

function render(payload) {
  const analysis = payload.analysis || {};
  const result = payload.result;

  if (!result) {
    root.innerHTML = header(payload) + waiting(analysis, payload);
    return;
  }

  const swing = result.swing || {};
  const parts = [header(payload)];

  parts.push(`<div class="score">${num(swing.overall_score, 0)}<small>/100</small></div>`);
  if (typeof swing.mechanics_score === "number") {
    parts.push(`<p class="muted">mechanics ${num(swing.mechanics_score, 0)}/100</p>`);
  }
  if (result.feedback && result.feedback.headline) {
    parts.push(`<p class="headline">${esc(result.feedback.headline)}</p>`);
  }

  // The "results are not as good" warning, made concrete after the fact.
  if (analysis.partial && (analysis.missing_roles || []).length) {
    parts.push(`<div class="banner warn"><strong>Incomplete bundle.</strong> Analyzed without
      ${analysis.missing_roles.map(roleName).map(esc).join(", ")}. These results are thinner
      than a full three-file swing.</div>`);
  }

  // Notes above the tips, deliberately: a note can say a checkpoint's own input was
  // impossible, and a headline built on that number must not be read without it.
  if ((result.notes || []).length) {
    parts.push(`<h2>Read first</h2><ul class="notes">` +
      result.notes.map((n) => `<li>${esc(n)}</li>`).join("") + `</ul>`);
  }

  parts.push(checkpoints(swing));
  parts.push(tips(result.feedback));
  parts.push(tempoBlock(payload, swing));
  parts.push(coachBlock(result.feedback));
  parts.push(shotBlock(swing.shot));
  parts.push(populationBlock(payload));
  parts.push(measurementsBlock(payload));
  parts.push(`<div id="history"></div>`);
  parts.push(videoBlock(analysis, result));
  parts.push(askBlock());

  root.innerHTML = parts.join("");
  wireAsk();
  wireTempo(payload);
}

function header(payload) {
  return `<h1>Swing ${esc(payload.swing_id)} <span class="muted">&middot;
    ${esc(payload.session_id)}</span></h1>`;
}

function waiting(analysis, payload) {
  if (analysis.status === "failed") {
    return `<div class="banner error"><strong>Analysis failed.</strong>
      ${esc(analysis.error || "No reason recorded.")}</div>`;
  }
  if (analysis.status === "queued" || analysis.status === "running") {
    return `<div class="banner info">Analyzing this swing now — pose on a 4K clip takes a few
      minutes. This page refreshes itself.</div>`;
  }
  const missing = (payload.missing_roles || []).map(roleName).map(esc).join(", ");
  return `<div class="banner info">Not analyzed yet.${missing
    ? ` Still waiting on ${missing}.` : ""}</div>`;
}

function checkpoints(swing) {
  const rows = (swing.checkpoint_scores || []).map((cp) => {
    const band = cp.expected_low !== null && cp.expected_low !== undefined
      ? `${num(cp.expected_low)} - ${num(cp.expected_high)}` : "no band";
    const pct = typeof cp.percentile === "number"
      ? `${num(cp.percentile, 0)}<span class="muted">${cp.population_n
          ? ` / ${cp.population_n}` : ""}</span>` : "-";
    return `<tr>
      <td>${esc(cp.name)}</td>
      <td class="num">${num(cp.observed)}</td>
      <td class="num muted">${band}</td>
      <td class="${cp.passed ? "pass" : "miss"}">${cp.passed ? "PASS" : "MISS"}</td>
      <td class="num">${pct}</td>
    </tr>`;
  }).join("");

  if (!rows) {
    return `<h2>Checkpoints</h2><p class="muted">None scored — no benchmark band matched, or
      the swing could not be segmented.</p>`;
  }
  const unscored = (swing.unscored || []).length
    ? `<p class="muted">not measured: ${swing.unscored.map(esc).join(", ")}</p>` : "";
  return `<h2>Checkpoints</h2><table>
    <tr><th>checkpoint</th><th class="num">observed</th><th class="num">tour band</th>
        <th></th><th class="num">pct</th></tr>
    ${rows}</table>${unscored}`;
}

function tips(feedback) {
  const list = (feedback && feedback.tips) || [];
  if (!list.length) return "";
  return `<h2>Tips — most actionable first</h2>` + list.map((tip) => {
    const sev = String(tip.severity || "info").toLowerCase();
    return `<div class="tip ${esc(sev)}"><span class="sev">${esc(sev)}${tip.checkpoint
      ? ` &middot; ${esc(tip.checkpoint)}` : ""}</span>${esc(tip.text)}</div>`;
  }).join("");
}

// The tempo trainer (ADR-023). Rendered directly under the tips because it is the one tip a
// golfer can act on in the room: "Tempo too quick" is a verdict with no next move attached, and
// this is the next move.
//
// Gated on the tempo checkpoint having *failed*, not on the plan existing — the API sends a plan
// for every swing it can build one for, and deciding whether to show it is this side's call
// because this side is what holds the verdict. A metronome offered to a golfer whose tempo is
// already in band is noise.
//
// The verdict prose is `checkpoint.message`, reused rather than rewritten. It is authored once in
// `analysis/checkpoints/mechanics.py` and already says which direction the miss was in; a second
// sentence composed here would be the copy this page has been bitten by twice.
//
// **No duration, ratio, tick count or mode name is written in this file.** Every one of them is
// derived server-side in `analysis/tempo_trainer.py` from the reference distributions and arrives
// on `payload.tempo_plan`. That is the same standing rule the placements block is pinned to, and
// the reason both patterns are computed there rather than one being derived here from the other:
// GRID's ratio is a *rounded* one, and a page recomputing it from CUES would silently print a
// number the golfer is not hearing.
let tempoPlanState = null;

function tempoBlock(payload, swing) {
  const plan = payload.tempo_plan;
  if (!plan || !(plan.patterns || []).length) return "";
  const cp = (swing.checkpoint_scores || []).find((c) => c.name === "tempo");
  if (!cp || cp.passed !== false) return "";

  const modes = plan.patterns.map((p, i) =>
    `<button type="button" data-mode="${i}" aria-pressed="${i === 0}">${esc(p.mode)}</button>`
  ).join("");

  return `<h2>Practice this tempo</h2><div class="tempo">
    <p class="why">${esc(cp.message)}</p>
    <p>Swing along with the beats: <strong>first beat</strong> start the takeaway,
      <strong>top</strong> is the top of the backswing, <strong>impact</strong> is the ball.
      Two count-in ticks come first, then it loops.</p>
    <div class="modes">${modes}</div>
    <div id="tempoStrip"></div>
    <div class="controls">
      <button type="button" class="play" id="tempoPlay">Play</button>
      <label>Pace <input type="range" id="tempoPace" min="70" max="140" step="1" />
        <span id="tempoPaceOut"></span></label>
    </div>
    <p class="facts" id="tempoFacts"></p>
    <p class="anchor" id="tempoAnchor"></p>
    <p class="src" id="tempoSrc"></p>
  </div>`;
}

// Everything below is presentation of a payload, with one exception worth naming: the pitch
// table. A role needs a *sound*, and a sound is not a fact about the swing — sending frequencies
// from the server would be absurd. So roles are named here, and only to be pitched and captioned.
//
// `subdivision` is quieter and lower than every cue on purpose. It marks nothing; it exists to
// keep the pulse audible through the ~900 ms the backswing takes, and a golfer who hears it as a
// cue would be swinging to the wrong beat.
const BEAT_TONE = {
  takeaway:    { hz: 660, gain: 0.30 },
  top:         { hz: 880, gain: 0.30 },
  impact:      { hz: 1320, gain: 0.34 },
  subdivision: { hz: 330, gain: 0.10 },
};

// How long each click sounds for. Short — a metronome tick, not a note.
const BEAT_SECONDS = 0.045;
// Count-in ticks before the first beat, and rest ticks between loops. Both measured in the
// pattern's *own* interval, so they stay in proportion at any pace and in either mode.
const COUNT_IN_TICKS = 2;
const REST_TICKS = 2;

let tempoAudio = null;
let tempoTimer = null;

function wireTempo(payload) {
  const plan = payload.tempo_plan;
  const play = document.getElementById("tempoPlay");
  if (!plan || !play) { tempoPlanState = null; return; }

  // The slider starts where the server fitted it, not at a neutral 100%. `plan.pace` is a
  // multiple of the *tour median* backswing, so a golfer whose own backswing is 11% longer opens
  // at 111% — the control shows the decision rather than hiding it, and dragging is an override.
  //
  // The bounds are the anchor guard's own range expressed as a pace (the corpus p10-p90 against
  // its median), so every value the fitter can produce is reachable; `pace` is clamped rather
  // than trusted, because a future guard could widen and a slider that cannot reach its own
  // starting value would silently play something other than what the page says.
  const pace = document.getElementById("tempoPace");
  const opening = Math.min(Number(pace.max), Math.max(Number(pace.min),
    Math.round((plan.pace || 1) * 100)));
  pace.value = String(opening);
  tempoPlanState = { plan, mode: 0, pace: opening / 100 };
  document.getElementById("tempoPaceOut").textContent = `${opening}%`;

  document.querySelectorAll(".tempo .modes button").forEach((btn) => {
    btn.addEventListener("click", () => {
      tempoPlanState.mode = Number(btn.dataset.mode);
      document.querySelectorAll(".tempo .modes button").forEach((b) =>
        b.setAttribute("aria-pressed", String(b === btn)));
      // Switching mode or pace rebuilds from the payload rather than rescaling what is playing:
      // the two patterns have different beat counts, so there is no correspondence to preserve.
      restartTempoIfPlaying();
      drawTempo();
    });
  });

  pace.addEventListener("input", () => {
    tempoPlanState.pace = Number(pace.value) / 100;
    document.getElementById("tempoPaceOut").textContent = `${pace.value}%`;
    restartTempoIfPlaying();
    drawTempo();
  });

  play.addEventListener("click", () => (tempoTimer ? stopTempo() : startTempo()));
  drawTempo();
}

function currentPattern() {
  return tempoPlanState.plan.patterns[tempoPlanState.mode];
}

// Beat times at the pace the golfer chose. The payload's own `pace` is what the server already
// applied (1.0 from this route), so the two multiply rather than one overriding the other.
function pacedBeats() {
  const scale = tempoPlanState.pace;
  return currentPattern().beats.map((b) => ({ role: b.role, at_ms: b.at_ms * scale }));
}

function pacedInterval() {
  return currentPattern().downswing_ms * tempoPlanState.pace;
}

function drawTempo() {
  const pattern = currentPattern();
  const beats = pacedBeats();
  const span = beats[beats.length - 1].at_ms || 1;

  // Bars separated by proportional gaps, so the strip is a picture of the real intervals.
  let strip = "";
  beats.forEach((b, i) => {
    if (i) strip += `<span class="gap" style="flex-grow:${(b.at_ms - beats[i - 1].at_ms) / span}">
      </span>`;
    strip += `<span class="b ${esc(b.role)}"></span>`;
  });
  document.getElementById("tempoStrip").innerHTML = `<div class="strip">${strip}</div>
    <div class="legend"><span>takeaway</span><span>top</span><span>impact</span></div>`;

  const plan = tempoPlanState.plan;
  const observed = (plan.observed_backswing_ms && plan.observed_downswing_ms)
    ? ` &middot; yours ${num(plan.observed_backswing_ms, 0)} / ${
        num(plan.observed_downswing_ms, 0)} ms (${
        num(plan.observed_backswing_ms / plan.observed_downswing_ms, 2)}:1)`
    : "";
  document.getElementById("tempoFacts").innerHTML =
    `${num(pattern.backswing_ms * tempoPlanState.pace, 0)} ms back / ${
      num(pattern.downswing_ms * tempoPlanState.pace, 0)} ms down &middot; ${
      num(pattern.ratio, 2)}:1${observed}`;
  // Which backswing the target was built on. A golfer swinging at 90 mph and one at 110 do not
  // share an absolute tempo — the corpus puts a whole speed cohort 167 ms apart on the backswing —
  // so the trainer fits to theirs where it can, and has to say when it could not.
  document.getElementById("tempoAnchor").textContent = plan.anchored
    ? "Matched to your own backswing — only the ratio is the tour's."
    : "Set to the tour median backswing: yours sits outside the tour range, so matching it would "
      + "have built the drill around the half that needs changing.";
  document.getElementById("tempoSrc").textContent = pattern.source;
}

function startTempo() {
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return;
  if (!tempoAudio) tempoAudio = new Ctx();
  // iOS starts every context suspended until a gesture resumes it; this runs inside a click.
  if (tempoAudio.state === "suspended") tempoAudio.resume();

  document.getElementById("tempoPlay").textContent = "Stop";
  scheduleTempoCycle();
}

// One cycle: the count-in, the pattern, then a rest, and re-arm. Scheduled a cycle at a time
// through the Web Audio clock rather than a click per `setTimeout` — `setTimeout` drifts by tens
// of milliseconds under load, which on a 267 ms downswing is a quarter of the interval.
function scheduleTempoCycle() {
  const beats = pacedBeats();
  const tick = pacedInterval();
  const start = tempoAudio.currentTime + 0.12;
  const countIn = COUNT_IN_TICKS * tick;

  for (let i = 0; i < COUNT_IN_TICKS; i++) {
    click(start + (i * tick) / 1000, BEAT_TONE.subdivision);
  }
  for (const b of beats) {
    click(start + (countIn + b.at_ms) / 1000, BEAT_TONE[b.role] || BEAT_TONE.subdivision);
  }

  const cycleMs = countIn + beats[beats.length - 1].at_ms + REST_TICKS * tick;
  tempoTimer = setTimeout(scheduleTempoCycle, cycleMs);
}

function click(at, tone) {
  const osc = tempoAudio.createOscillator();
  const gain = tempoAudio.createGain();
  osc.frequency.value = tone.hz;
  // Ramped rather than switched: a square-edged gain change is an audible pop on every tick.
  gain.gain.setValueAtTime(0, at);
  gain.gain.linearRampToValueAtTime(tone.gain, at + 0.005);
  gain.gain.exponentialRampToValueAtTime(0.0001, at + BEAT_SECONDS);
  osc.connect(gain).connect(tempoAudio.destination);
  osc.start(at);
  osc.stop(at + BEAT_SECONDS + 0.02);
}

function stopTempo() {
  clearTimeout(tempoTimer);
  tempoTimer = null;
  const play = document.getElementById("tempoPlay");
  if (play) play.textContent = "Play";
}

function restartTempoIfPlaying() {
  if (!tempoTimer) return;
  clearTimeout(tempoTimer);
  scheduleTempoCycle();
}

// M6. Rendered after the tips because it is a synthesis of them, and gated on provenance as
// well as text: prose with no named author is indistinguishable from a measurement, and this
// page's whole job is keeping that line visible.
function coachBlock(feedback) {
  const text = feedback && feedback.coaching_text;
  const prov = feedback && feedback.coaching;
  if (!text || !prov) return "";
  const paras = text.split(/\n\s*\n/)
    .map((p) => p.trim()).filter(Boolean)
    .map((p) => `<p>${esc(p)}</p>`).join("");
  return `<h2>Coach</h2><div class="coach">
    <p class="by">Written by ${esc(prov.model)} from the measured numbers on this page —
      not itself a measurement.</p>${paras}</div>`;
}

// M6 follow-ups (ADR-020). The conversation lives on the server — this holds only the id, so a
// reload or a second phone picks the same thread back up rather than starting a parallel one.
let conversationId = null;

function askBlock() {
  return `<h2>Ask about this swing</h2><div class="ask">
    <div id="askTurns"></div>
    <form id="askForm">
      <input id="askInput" type="text" autocomplete="off"
             placeholder="why is my tempo quick?" aria-label="Ask about this swing" />
      <button type="submit">Ask</button>
    </form>
    <p class="muted" id="askNote"></p>
  </div>`;
}

function turnHtml(role, text) {
  const who = role === "user" ? "you" : "coach";
  const paras = String(text).split(/\n\s*\n/)
    .map((p) => p.trim()).filter(Boolean)
    .map((p) => `<p>${esc(p)}</p>`).join("");
  return `<div class="turn ${who}"><span class="who">${who}</span>${paras}</div>`;
}

function wireAsk() {
  const form = document.getElementById("askForm");
  if (!form) return;
  const input = document.getElementById("askInput");
  const turns = document.getElementById("askTurns");
  const note = document.getElementById("askNote");
  const button = form.querySelector("button");

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const question = input.value.trim();
    if (!question) return;

    // Render the question immediately, then lock the form. A turn takes several seconds — the
    // model makes tool calls between round trips — and a second submit mid-flight would start a
    // parallel turn against the same transcript.
    turns.insertAdjacentHTML("beforeend", turnHtml("user", question));
    input.value = "";
    input.disabled = button.disabled = true;
    note.textContent = "Thinking…";

    try {
      const res = await fetch(
        `/api/sessions/${encodeURIComponent(sessionId)}/swings/${encodeURIComponent(swingId)}/ask`,
        {
          method: "POST",
          headers: { ...authHeaders(), "Content-Type": "application/json" },
          body: JSON.stringify({ question, conversation_id: conversationId }),
        });
      if (!res.ok) throw new Error(`server said ${res.status}`);
      const body = await res.json();
      conversationId = body.conversation_id || conversationId;
      if (body.tools_called && body.tools_called.length) {
        turns.insertAdjacentHTML("beforeend",
          `<p class="tools">looked up: ${esc(body.tools_called.join(", "))}</p>`);
      }
      if (body.text) turns.insertAdjacentHTML("beforeend", turnHtml("assistant", body.text));
      // A note is the expected-failure channel, not an error: no key, a rate limit, an answer
      // that ran out of steps. It sits under the form rather than in the thread, because it is
      // about the request rather than something the coach said.
      note.textContent = body.note || "";
    } catch (err) {
      note.textContent = `Could not ask: ${err.message}`;
    } finally {
      input.disabled = button.disabled = false;
      input.focus();
    }
  });
}

// Restore the swing's most recent conversation on load. The server resolves the swing to its
// newest transcript (ADR-020), so this is what makes the comment above `conversationId` true: a
// reload, or the same swing URL on a second phone, resumes the one thread instead of orphaning
// it behind a fresh one. Runs after `render`, so `#askTurns` exists; `render` rebuilds that node
// each call, so a re-render while analysis polls cannot double up the restored turns.
async function loadConversation(payload) {
  const turns = document.getElementById("askTurns");
  if (!turns) return;   // analysis still running — no ask panel yet; nothing to restore into

  let convo;
  try {
    const res = await fetch(
      `/api/sessions/${encodeURIComponent(sessionId)}/swings/${encodeURIComponent(swingId)}/conversation`,
      { headers: authHeaders() });
    if (!res.ok) return;   // an unreadable thread is treated as none: the empty panel is correct
    convo = await res.json();
  } catch (err) {
    return;                // a lost conversation costs a re-ask and must never break the page
  }

  if (!convo.conversation_id) return;   // nothing seeded for this swing yet — first-visit state
  conversationId = convo.conversation_id;
  for (const turn of convo.turns || []) {
    // The same renderer the live submit path uses, so a restored turn and a just-asked one are
    // byte-identical markup.
    turns.insertAdjacentHTML("beforeend", turnHtml(turn.role, turn.text));
  }
}

const SHOT_FIELDS = [
  ["carry", "carry_distance"], ["total", "total_distance"],
  ["ball speed", "ball_speed"], ["club speed", "club_head_speed"],
  ["smash", "smash_factor"], ["path", "club_path"],
  ["face", "club_face_angle"], ["launch", "launch_angle"],
  ["spin", "spin_rate"], ["shape", "shot_type"], ["strike", "impact_position"],
];

function shotBlock(shot) {
  if (!shot) {
    return `<h2>Shot data</h2><p class="muted">No shot-screen photo in this bundle — no
      launch-monitor numbers attached.</p>`;
  }
  const cells = SHOT_FIELDS
    .filter(([, key]) => shot[key] !== null && shot[key] !== undefined)
    .map(([label, key]) => {
      const raw = shot[key];
      const value = typeof raw === "number" ? num(raw) : esc(raw);
      return `<div><span>${esc(label)}</span><span>${value}</span></div>`;
    }).join("");

  const prov = shot.provenance;
  // ADR-014: OCR off a photograph of a screen is trusted, but never silently.
  const review = prov && prov.needs_review
    ? `<div class="banner warn"><strong>Needs review.</strong> These numbers were read off the
       screen photo with ${num((prov.parse_confidence || 0) * 100, 0)}% confidence.
       ${(prov.warnings || []).map(esc).join(" ")}</div>` : "";
  return `<h2>Shot data</h2><div class="shot">${cells}</div>${review}`;
}

// Where this swing sits against a population of tour professionals. Expanded rather than
// collapsed, and above the unjudged metrics, because these numbers *do* have a population behind
// them — what they lack is a band, which is a different absence and the opposite reading.
//
// Every one of these shipped for two milestones as a bare `name / value / unit` row inside the
// block below, under a caption promising no percentile — while the percentile, the population
// size and the "NOT calibrated" warning all sat in the `detail` string this page was dropping.
// `tour_trajectory_q_dtl` is the reason that mattered: it is the largest number on three of the
// four stored swings and on those three it is a mis-detected anchor, not the golfer.
//
// `detail` is therefore the row's primary content and not a tooltip, and calibration is stamped
// on the line carrying the value rather than left to the caption — the same argument
// `feedback/coach.py` makes about its brief, and the reason `_checkpoint_line` repeats
// `one_sided`: a reader applies a general warning to the numbers it remembers.
function populationBlock(payload) {
  const list = payload.population || [];
  if (!list.length) return "";
  // Grouped by the view the API resolved off `PlacementSpec`, never by parsing the name. Two
  // cameras, two fitted bases, two populations: a difference between the groups is not a finding.
  const views = [];
  for (const p of list) {
    let group = views.find((g) => g.view === p.view);
    if (!group) views.push((group = { view: p.view, rows: [] }));
    group.rows.push(p);
  }
  const groups = views.map((g) => `<p class="vw">${esc(g.view)}</p>` +
    g.rows.map((p) => `<div class="p">
      <div class="top">
        <span class="name">${esc(p.name)}</span>
        <span class="v">${num(p.value, 2)}<span class="u">${esc(p.unit.replace(/_/g, " "))}</span>
          ${p.calibrated ? "" : `<span class="flag">not calibrated</span>`}</span>
      </div>
      <p class="d">${esc(p.detail)}</p>
    </div>`).join("")).join("");
  return `<h2>Against the tour population</h2>
    <p class="muted">Distances from a group of tour professionals, as a combination of your
      numbers and as a motion. Every swing behind them is a tour swing, so a large value means
      <strong>unusual</strong> — a reason to look, never a fault. None of these has a band and
      none is part of your score. The two camera groups are compared against their own
      populations and never against each other.</p>
    <div class="plc">${groups}</div>`;
}

// Measured but not judged: no band, so no pass/fail, no percentile, no colour. Collapsed by
// default and placed last, because a number nobody can yet say is good or bad is reference
// material rather than feedback — and rendering it like the checkpoint table above would invite
// exactly the reading it cannot support.
//
// Both exclusions are the API's lists rather than names typed here, so the block cannot go stale
// the way the caption did. Placements leave because they have a population and belong above;
// the checkpoint metrics leave because they are judged in the table at the top of this page, and
// a block captioned "not yet judged" listing them again was false about six of its fourteen rows.
function measurementsBlock(payload) {
  const swing = (payload.result || {}).swing || {};
  const shown = new Set([
    ...(payload.population || []).map((p) => p.name),
    ...(payload.judged_metrics || []),
  ]);
  const list = (swing.measurements || []).filter((m) => !shown.has(m.name));
  if (!list.length) return "";
  const rows = list.map((m) => `<tr>
      <td>${esc(m.name)}</td>
      <td class="num">${num(m.value, 3)}</td>
      <td class="muted">${esc(m.unit.replace(/_/g, " "))}</td>
    </tr>`).join("");
  return `<details class="measured"><summary>Measured, not yet judged (${list.length})</summary>
    <p class="muted">These have no tour benchmark band yet, so nothing here is a pass, a fail, or a
      percentile. They are recorded so bands can be derived from real swings later.</p>
    <table>${rows}</table></details>`;
}

// Career mode, step 6. This swing's eight measurements against the golfer's own corpus — the
// half of the scoring model tour bands cannot supply, since a 15-handicap held to a tour p10-p90
// fails everything forever.
//
// Reads the same `/api/golfers/{id}/career` route the career page reads, rather than a per-swing
// variant of it: one endpoint means the number here and the number there cannot disagree.
async function loadHistory(payload) {
  const slot = document.getElementById("history");
  if (!slot) return;

  const measurements = ((payload.result || {}).swing || {}).measurements || [];
  if (!measurements.length) return;

  if (!payload.player_id) {
    slot.innerHTML = `<h2>Against your own history</h2><p class="muted">This swing names no
      golfer, so it belongs to nobody's history. Set one on the upload page — the swing row
      there has a repair link — and it joins the corpus.</p>`;
    return;
  }

  let career;
  try {
    const res = await fetch(`/api/golfers/${encodeURIComponent(payload.player_id)}/career`,
      { headers: authHeaders() });
    if (!res.ok) return;   // a 404 here means an unregistered id; the swing page still stands
    career = await res.json();
  } catch (err) {
    return;
  }

  const metrics = (career.baseline || {}).metrics || {};
  const standing = (career.standing || {}).metrics || {};
  const link = `/career.html?player=${encodeURIComponent(payload.player_id)}`;

  const rows = measurements.map((m) => {
    const base = metrics[m.name];
    // Formatted by the metric's unit, not with the table above's flat 3 decimals: this row puts
    // the swing's value directly beside the golfer's typical one, and "9.116 vs your typical 8.6"
    // makes a reader check whether they are even the same quantity.
    const value = fmtUnit(m.value, m.unit);
    if (!base) {
      return histRow(m.name, value, "not in the corpus yet — this swing may not have been " +
        "re-read since it was analyzed");
    }
    if (typeof base.mean !== "number") {
      const why = (base.withheld || []).find((r) => r.claim === "center");
      return histRow(m.name, value, why ? why.reason : `n = ${base.n}, not enough for a typical value`);
    }
    // A typical value exists, so this swing can be placed against it — and against the tour, if
    // that metric has a population it may be placed in.
    const unit = base.unit;
    let note = `your typical ${fmtUnit(base.mean, unit)}`;
    if (base.mean_ci) {
      note += ` (95% CI ${fmtUnit(base.mean_ci.low, unit)}–${fmtUnit(base.mean_ci.high, unit)})`;
    }
    // Never the bare word "outside": on a one-sided magnitude like finish_balance_norm a center
    // below p10 is better than the tour population, and "outside tour range" renders that
    // identically to a center above p90. career.html carries the same rule and the same reason.
    const tour = standing[m.name];
    if (tour && tour.standing !== "withheld") {
      const side = tour.standing === "inside" ? "inside tour range"
        : tour.standing === "straddles" ? "cannot tell against tour range"
        : (typeof tour.outside_by === "number" && tour.outside_by < 0)
          ? "below tour range" : "above tour range";
      note += ` · ${side}`;
    }
    return histRow(m.name, value, note);
  }).join("");

  slot.innerHTML = `<h2>Against your own history</h2><div class="hist">${rows}</div>
    <p class="muted">Built from ${career.corpus.distinct_swings} distinct swing${
      career.corpus.distinct_swings === 1 ? "" : "s"}.
    <a href="${link}">See the full career page</a>.</p>`;
}

function histRow(name, value, note) {
  return `<div class="m"><span class="name">${esc(name)}</span>
    <span class="v">${esc(value)}<em>${esc(note)}</em></span></div>`;
}

// Matches career.html and the career CLIs: one decimal for degrees, three otherwise.
function fmtUnit(value, unit) {
  if (typeof value !== "number") return "-";
  return unit === "degrees" ? value.toFixed(1) : value.toFixed(3);
}

function videoBlock(analysis, result) {
  if (analysis.has_video) {
    const hostile = analysis.video_codec === "mp4v";
    // Two panels side by side imply frame correspondence everywhere; only the top tier earns
    // that. Say which tier this is in words, and say *why* it degraded — the notes name the
    // camera and the measurement, which is the difference between "trust this less" and a
    // viewer wondering whether their swing or the tool is at fault.
    const alignment = result.alignment || {};
    const summary = alignment.quality_summary || alignment.quality;
    const quality = summary ? `<p class="muted">${esc(summary)}</p>` : "";
    const notes = (alignment.notes || []).length
      ? `<ul class="notes">${alignment.notes.map((n) => `<li>${esc(n)}</li>`).join("")}</ul>`
      : "";
    return `<h2>Aligned views</h2>
      <video controls playsinline preload="metadata" src="${videoUrl("aligned")}"></video>
      ${quality}
      ${notes}
      ${hostile ? `<div class="banner warn">This clip is MPEG-4 Part 2, which most browsers
        will not play. Download it, or install openh264 so H.264 is available — see the
        README.</div>` : ""}
      <p><a href="${videoUrl("aligned")}" download>Download the aligned clip</a></p>`;
  }
  // No aligned render — usually a face-on-only bundle. The raw clip is better than nothing.
  return `<h2>Video</h2><p class="muted">No aligned video: the two views could not be aligned,
    or there was only one.</p>
    <video controls playsinline preload="metadata" src="${videoUrl("face_on")}"></video>`;
}

load();
</script>
</body>
</html>

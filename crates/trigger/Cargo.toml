[package]
name = "trigger"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Ball-strike detection: the offline detector this repo's Python reference defines, and the online one that cuts a clip live."

[[bin]]
name = "golf-trigger"
path = "src/bin/golf_trigger.rs"

[dependencies]
rustfft.workspace = true
flate2.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# For `contracts::audio::AUDIO_DETECTOR_VERSION` alone, so `tests/conformance.rs` holds the audio
# vectors to the one number `golf-lab` stamps rather than to a second copy of it (M29 P21). A test
# edge only: the library keeps no edge to `contracts`, because it has a Python caller and no need
# of one, and `contracts` depends on nothing of this crate's.
contracts = { path = "../contracts" }

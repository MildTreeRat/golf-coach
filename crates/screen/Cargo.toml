[package]
name = "screen"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The launch-monitor screen reader: OCR boxes in, a parsed shot out. The port of src/golf_coach/launch_monitor/screen/."

[dependencies]
# **`analysis` is deliberately absent, and so is everything of ours but `pyfmt`** (ADR-008 as a
# cargo edge, M34 P3). The parser has to say what CPython said — `{label!r}` in a warning, `//` in
# a line bucket, Python's whitespace and `upper` — and `pyfmt` is where those live, below every
# crate that needs them.
pyfmt = { path = "../pyfmt" }
# For `ShotData`, which `read` builds (M34 P6). Declared in the phase that first crosses it rather
# than with the crate in P3, because an edge nothing crosses is a claim cargo cannot check.
contracts = { path = "../contracts" }
# `profiles.json` is read at compile time and parsed once, as `contracts/devices.json` is.
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# For `golf_core::compare` alone: `docs/CONFORMANCE.md` §3's rules as library code, so the screen
# family is judged by the comparator `golf-core rerecord` will re-record it with (M34 P7), not by a
# second one written here. A test-only edge, so ADR-008's normal edges above are unchanged. Since
# `golf-core` gained `screen` as a dependency for `parse-screen` (M34 P6) this is a dev-dependency
# cycle, which cargo permits: the integration tests link one `screen`, the one `golf-core` links.
golf-core = { path = "../core" }

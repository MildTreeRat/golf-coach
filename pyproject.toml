[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "golf-coach"
version = "0.0.1"
description = "Home-lab AI golf swing analysis system: capture, pose, club detection, launch-monitor data, and coaching feedback."
requires-python = ">=3.11"
# Base deps are intentionally tiny so any module can be worked on without pulling
# the heavy ML/vision stack. Install the extras you need (see [project.optional-dependencies]).
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
# Pose + detection + video. Needed for M1 (pose) and M2 (YOLOv8).
vision = [
    "numpy>=1.26",
    "opencv-python>=4.9",
    "mediapipe>=0.10",
    "ultralytics>=8.1",
]
# FastAPI orchestrator (the imperative shell).
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]
# LLM coaching + MCP server.
llm = [
    "anthropic>=0.40",
    # 2.0, not the 1.0 this originally declared: the server API was renamed (FastMCP ->
    # MCPServer) and the wire fields moved to snake_case (inputSchema -> input_schema,
    # isError -> is_error). `golf_coach.mcp.server` is written against 2.x and raises
    # ImportError on 1.x, so the floor has to say so.
    "mcp>=2.0",
]
# Launch-monitor hardware (Garmin R10 over BLE). Not needed for the mock source.
hardware = [
    "bleak>=0.21",
]
# Local OCR for reading shot data off photos of the simulator screen (ADR-014). Needed
# only to *import* screenshots; `ScreenShotDataSource` reads the parsed results with no
# extras at all. Includes opencv/numpy so it installs standalone without `vision`.
ocr = [
    "paddleocr>=2.7",
    "paddlepaddle>=2.6",
    "opencv-python>=4.9",
    "numpy>=1.26",
    # HEIC/HEIF, which is what an iPhone camera writes by default. OpenCV has no decoder for
    # it and `cv2.imread` signals that the same way it signals a corrupt file — by returning
    # None — so without this an ordinary photo off the camera roll is indistinguishable from
    # garbage. `preprocess.load_image` falls back to Pillow when this is installed and says so
    # explicitly when it is not.
    "pillow>=10.0",
    "pillow-heif>=0.16",
]
# Audio for acoustic synchronization (M11, ADR-015 Option C). Needed to *decode* a clip's audio
# track and to *detect* the transients in it; the stored `{role}.audio.json` those two produce
# reads with no extras at all, which is the split `ocr` has and the one that matters — the
# analysis core consumes the artifact, never the waveform.
#
# imageio-ffmpeg ships a static ffmpeg binary as a wheel, so there is no system install to keep in
# step with the venv. It is a *demuxer* dependency, not a convenience: the corpus carries
# non-uniform audio edit lists (docs/M11_ACOUSTIC_SYNC.md §E2) and applying one correctly is the
# thing being bought.
#
# numpy is here for `audio/impact.py` alone — an FFT per 5 ms hop over a 30-second clip, which is
# not stdlib arithmetic's job. It sits on the far side of the same seam ADR-022 draws for fitted
# models: heavy numerics at the I/O edge, plain data (a sample index and a confidence) downstream.
# `analysis/` still has no numpy and `tests/api/test_pipeline_imports.py` is what says so.
audio = [
    "imageio-ffmpeg>=0.4",
    "numpy>=1.26",
]
# Offline research / reference-data derivation (M4-REF, M8-PAIR). Used ONLY by scripts/golfdb/*
# and scripts/caddieset/*, never by the package: pandas appears at exactly one boundary (reading
# GolfDB's pickled DataFrame), after which everything downstream is stdlib. Keeping it out of
# `vision` keeps the invariant that the analysis core installs and tests with no extras at all
# (ADR-008).
#
# numpy and scikit-learn are here for the same reason and under the same rule: model *fitting*
# happens offline in scripts, and what ships is the fitted artifact as committed JSON that stdlib
# code evaluates — the pattern `ranges.json` and `golfdb_v1.json` already are (ADR-022). If a
# `golf_coach.*` module ever imports either of these, that invariant has been broken, and
# tests/api/test_pipeline_imports.py is what says so.
research = [
    "pandas>=2.0",
    "numpy>=1.26",
    "scikit-learn>=1.4",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.9",
    "httpx2",  # fastapi.testclient.TestClient's transport dependency
]
# Convenience: everything at once.
all = [
    "golf-coach[vision,api,llm,hardware,ocr,audio,research,dev]",
]

[tool.hatch.build.targets.wheel]
packages = ["src/golf_coach"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
